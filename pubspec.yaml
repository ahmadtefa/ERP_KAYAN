name: erp_kayan
description: "KAYAN ERP - cross-platform enterprise resource planning client"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  decimal: ^3.2.6
  dio: ^5.11.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  logging: ^1.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The owner's logo, used exactly as supplied (transparent PNG).
    - 1.png

  # Typography, shipped inside the program.
  #
  # These are the real IBM Plex Sans Arabic files from the upstream open
  # source release (SIL Open Font License 1.1, `assets/fonts/OFL-*.txt`),
  # bundled rather than fetched: the product runs on machines with no
  # internet, and a PDF or a report that silently falls back to a different
  # face would change the look of a printed offer.
  #
  # One family is registered for four weights. IBM Plex Sans Arabic is the
  # Arabic member of the Plex superfamily, whose Latin is drawn to the same
  # metrics - so Arabic and English on one line share a baseline, an x-height
  # and a figure width instead of looking like two documents stapled together.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
