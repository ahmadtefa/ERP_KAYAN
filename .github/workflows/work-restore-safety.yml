name: Work restore safety (no Installer)

on:
  push:
    branches: ['work/restore-recovery-20261123', 'arena/98e79137-erp-kayan']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_acceptance
      KAYAN_TEST_PG_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
      DATABASE_URL_KAYAN_ROUNDTRIP: postgresql://ci:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/patch-adapter-pg-name-type.mjs
      - run: npx prisma generate
      - run: node scripts/apply-migrations.mjs
      - run: npm run build
      - name: Workflow safety inventory
        run: node ../scripts/ci-workflow-safety.test.cjs
      - name: Changed production files lint
        run: npx eslint src/common/maintenance/*.ts src/app.module.ts src/main.ts src/common/prisma/prisma.service.ts src/modules/backup/backup.service.ts src/modules/backup/backup.controller.ts src/modules/backup/full-backup.controller.ts src/modules/backup/system/complete-backup.controller.ts src/modules/backup/system/restore-authority.ts src/modules/backup/system/database-identity.ts src/modules/backup/system/restore-state.ts src/modules/backup/system/move-restore-directory.ts src/modules/backup/system/dump-recovery-coordinator.ts src/modules/backup/full-backup.service.ts src/modules/backup/backup-schedule.service.ts src/modules/backup/system/pg-support.ts src/modules/backup/system/restore-journal.ts src/modules/backup/system/restore-lock.ts src/modules/backup/system/restore-tool.ts src/modules/backup/system/system-restore.service.ts src/modules/notifications/expiry-alert.scheduler.ts
      - name: Price and inventory-report redaction
        run: >-
          npx jest --runInBand
          common/auth/price-redaction.spec.ts
          modules/inventory/inventory-analysis.controller.spec.ts
      - name: Focused regression tests
        run: npx jest --runInBand common/maintenance/maintenance.spec.ts common/maintenance/startup-coordination.spec.ts modules/backup/full-backup-recovery-safety.spec.ts modules/backup/full-backup.service.spec.ts modules/backup/system/restore-journal.spec.ts modules/backup/system/system-restore-maintenance.spec.ts modules/backup/system/dump-recovery-coordinator.spec.ts modules/backup/system/move-restore-directory.spec.ts modules/backup/system/system-restore-files.spec.ts modules/backup/backup-schedule-safety.spec.ts modules/notifications/expiry-alert.scheduler.spec.ts
      - name: JSON and DUMP real PostgreSQL regression
        env:
          KAYAN_COMPANY_BACKUP_PG: '1'
          KAYAN_REAL_PG_TESTS: '1'
        run: npx jest --runInBand modules/backup/company-backup.postgres.spec.ts modules/backup/system/restore-multiprocess.postgres.spec.ts modules/backup/full-backup-real-pg.spec.ts modules/backup/system/restore-authority.postgres.spec.ts
      - name: Sign-out, refresh rotation and password sessions on PostgreSQL
        env:
          KAYAN_AUTH_SESSION_PG: '1'
        run: >-
          npx jest --runInBand
          modules/auth/auth.logout.postgres.spec.ts
          modules/auth/auth.refresh-rotation.postgres.spec.ts
          modules/auth/auth.password-sessions.postgres.spec.ts
      - name: Independent APIs and killed DUMP owner
        run: node --test scripts/restore-multiprocess.test.cjs
      - name: Complete archive through the production API
        env:
          KAYAN_ADMIN_USERNAME: ci-admin
          KAYAN_ADMIN_PASSWORD: CI-only-Admin-Password-12345
          JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
          HOST: 127.0.0.1
          PORT: '3001'
        shell: bash
        run: |
          set -euo pipefail
          export KAYAN_BACKUP_DIR="$RUNNER_TEMP/kayan-full-http/backups"
          export KAYAN_UPLOAD_DIR="$GITHUB_WORKSPACE/build/restore-test-uploads"
          export LICENSE_STATE_DIR="$RUNNER_TEMP/kayan-full-http/licence"
          mkdir -p "$KAYAN_UPLOAD_DIR"
          printf 'synthetic upload sentinel' > "$KAYAN_UPLOAD_DIR/sentinel.txt"
          npx ts-node prisma/seed.ts
          node dist/src/main.js > "$RUNNER_TEMP/kayan-full-http-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/kayan-full-http-api.log"; exit 1; fi
          node scripts/scenario-system-backup.mjs http://127.0.0.1:3001/api/v1
          # Prices, cost and warehouse scope, through the same production API.
          # Only synthetic data: the scenario creates its own branch, shelves
          # and account and removes them afterwards.
          ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 \
            node scripts/scenario-price-isolation.mjs http://127.0.0.1:3001/api/v1

  postgres-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - name: Atomic directory moves and copy failures on Windows
        run: npx jest --runInBand modules/backup/system/move-restore-directory.spec.ts modules/backup/system/system-restore-files.spec.ts
      - name: Disposable PostgreSQL and killed restore owner on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $pg = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Sort-Object { [int]$_.Name } -Descending | Select-Object -First 1
          if (-not $pg) { throw 'PostgreSQL tools are required; this test must not be skipped.' }
          $bin = Join-Path $pg.FullName 'bin'
          $env:PATH = "$bin;$env:PATH"
          $data = Join-Path $env:RUNNER_TEMP 'kayan-restore-pg'
          & "$bin\initdb.exe" -D $data -U ci -A trust --no-locale -E UTF8
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & "$bin\pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP\kayan-restore-pg.log" -o '-p 55432' -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start' }
          try {
            $env:KAYAN_TEST_PG_URL = 'postgresql://ci@127.0.0.1:55432/postgres'
            node --test scripts/restore-multiprocess.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows restore safety test failed' }
          } finally {
            & "$bin\pg_ctl.exe" -D $data -m immediate -w stop
          }

  # The handover recorded that the Windows delivery path was never proven for
  # this head: the only Windows evidence was a Backend build, and the workflow
  # named "build only" actually builds the whole Setup. This job builds the
  # Flutter desktop application alone, from this exact commit, and records what
  # it produced. It is not an installer, not an installed-product test and not
  # release evidence.
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout is the exact source head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Checkout does not match the event source head.' }
          Write-Host "Source commit: $actual"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Syntax first: every bundled script must at least parse on the same
      # Windows PowerShell host Inno Setup invokes. The Work branch is the
      # source the installer is built from, so this has to hold here too.
      - name: Parse every bundled Windows PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'distribution/windows' -Filter '*.ps1' -File -Recurse)
          if ($files.Count -eq 0) { throw 'No Windows PowerShell runtime scripts were found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              throw "PowerShell syntax error in $($file.FullName): $detail"
            }
          }
          Write-Host "PowerShell parser passed for $($files.Count) bundled scripts."
      - name: Build Windows application (not Setup)
        run: flutter build windows --release --no-pub
      - name: Verify output exists and record its hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $exe = "$release/erp_kayan.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Windows executable not found.' }
          $file = Get-Item -LiteralPath $exe
          if ($file.Length -eq 0) { throw 'Windows executable is empty.' }

          # erp_kayan.exe is only the C++ runner shell. In a release build the
          # application itself is the engine DLL and the AOT snapshot, so a
          # present-but-empty exe must not be recorded as a working build.
          foreach ($required in @('flutter_windows.dll', 'data/icudtl.dat', 'data/app.so')) {
            $path = Join-Path $release $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release component: $required" }
            $size = (Get-Item -LiteralPath $path).Length
            if ($size -eq 0) { throw "Release component is empty: $required" }
            Write-Host ("{0,12}  {1}" -f $size, $required)
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Application executable bytes: $($file.Length)"
          Write-Host "Application executable SHA256: $hash"
          Write-Host "::notice title=Windows application build::erp_kayan.exe built from $env:GITHUB_SHA ($($file.Length) bytes, SHA256 $hash)"
          Write-Host 'Not an installer, not an installed-product test, and not release evidence.'
      # The documented packaging command the installer script depends on did
      # not exist, so the Windows build failed before producing an artifact.
      # This runs it on Windows, in the same order build-installer.ps1 does.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies for the packaging command
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
      - name: Clean backend build (the packaging precondition)
        working-directory: backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A stale file from an earlier commit must not survive into a package.
          [void](New-Item -ItemType Directory -Force -Path 'dist')
          Set-Content -LiteralPath 'dist/stale-from-an-earlier-commit.js' -Value 'stale'
          npm run build:clean
          if ($LASTEXITCODE -ne 0) { throw 'The packaging command npm run build:clean failed.' }
          if (-not (Test-Path -LiteralPath 'dist/src/main.js' -PathType Leaf)) { throw 'build:clean did not produce dist/src/main.js.' }
          if (Test-Path -LiteralPath 'dist/stale-from-an-earlier-commit.js') { throw 'build:clean left a stale file in dist.' }
          Write-Host 'build:clean removed the stale file and produced a clean compile.'

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: |
          set +e
          flutter analyze > "$RUNNER_TEMP/analyze.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.log"
          # Surface each diagnostic as an annotation so a failure is readable
          # without downloading the raw log.
          grep -E '^\s*(error|warning|info)\s+•' "$RUNNER_TEMP/analyze.log" | while IFS= read -r line; do
            echo "::error title=flutter analyze::$line"
          done
          exit "$status"
      - run: flutter test
