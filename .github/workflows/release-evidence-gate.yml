name: Release security evidence (not release approval)

# Release-only evidence must not fail ordinary pull-request CI. PRs receive an
# explicit notice that this evidence has not been collected. The protected
# main-branch gate remains failing until evidence from the approved isolated
# Windows VM is attached and authenticated for the exact release artifact.
# This workflow never publishes or modifies a release.
on:
  pull_request:
    branches: [main, 'arena/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licence-evidence-required:
    name: Signed licence and installed-product evidence required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report release-only evidence is not run on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo '::notice title=Release evidence pending::Signed production-licence and installed-product evidence must be collected in the approved isolated Windows VM before release. This release-only gate does not block ordinary pull-request CI.'

      - name: Block main-branch release without approved evidence
        if: github.event_name == 'push'
        run: |
          echo '::error title=Release approval blocked::Signed production-licence and installed-product evidence from the approved isolated Windows VM is required for the exact release artifact. No release is approved.'
          exit 1
