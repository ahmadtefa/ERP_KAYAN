name: Integrated Windows candidate (not a release)

on:
  push:
    branches: ['arena/2d794f08-erp-kayan']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-generator:
    name: Generator source flow with an ephemeral key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - run: node --test tools/license-generator/memory-flow.test.mjs
      - run: echo 'Source-only test with a synthetic key; the packaged Windows generator was not tested.'

  prisma-postgres:
    name: Standard Prisma and isolated PostgreSQL upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan?schema=public
      KAYAN_TEST_ADMIN_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Use a separate native config: the local experimental JS schema-engine
      # configuration is not evidence for a standard Prisma CLI migration.
      - name: Standard native Prisma generate, validate and clean deploy
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PRISMA_SCHEMA_ENGINE_BINARY:-}${PRISMA_QUERY_ENGINE_LIBRARY:-}"
          printf "import { defineConfig } from 'prisma/config';\nexport default defineConfig({schema: 'prisma/schema.prisma'});\n" > prisma-native-ci.config.ts
          trap 'rm -f prisma-native-ci.config.ts' EXIT
          npx prisma generate --config prisma-native-ci.config.ts
          npx prisma validate --config prisma-native-ci.config.ts
          npx prisma migrate deploy --config prisma-native-ci.config.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Standard native Prisma populated upgrade with data checks
        run: node scripts/verify-prisma-native-upgrade.mjs
      - name: Additional licensing and restore checks on isolated synthetic databases
        run: python ../scripts/ci-diagnose.py node scripts/verify-licensing-postgres.mjs

  build:
    name: Build product-key Setup from this commit
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Check Flutter analysis and unit selection behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          $log = Join-Path $env:RUNNER_TEMP 'candidate-flutter-analysis.log'
          & flutter analyze --no-pub --machine *> $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = ((Get-Content -LiteralPath $log -Tail 35) -join ' | ').Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            if ($detail.Length -gt 12000) { $detail = $detail.Substring(0, 12000) }
            Write-Output "::error title=Flutter preflight analysis::$detail"
            throw 'Flutter analysis failed'
          }
          $tests = Join-Path $env:RUNNER_TEMP 'candidate-unit-tests.jsonl'
          & flutter test --no-pub --reporter json test/widget/invoice_unit_selection_test.dart *> $tests
          if ($LASTEXITCODE -ne 0) {
            & node scripts/report-flutter-test-failures.mjs $tests
            throw 'Invoice unit selection tests failed'
          }
      - name: Check source and install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            Write-Output '::error title=Source identity::Source SHA mismatch'
            throw 'Source SHA mismatch'
          }
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($changes.Count) {
            $detail = (($changes | Select-Object -First 30) -join ' | ').Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Dirty source after Flutter preflight::$detail"
            throw 'Source checkout is not clean'
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Inno package install::Chocolatey returned $LASTEXITCODE"
            throw 'Inno Setup install failed'
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno compiler missing' }
          # ISCC /? reports only major version 6; its FileVersionInfo on the
          # hosted image has also been 0.0.0.0. Record the installed Chocolatey
          # package version and the compiler binary hash instead of inventing
          # a version from either incomplete source.
          $versionOutput = (& choco list --exact innosetup --limit-output 2>&1 | Out-String)
          Write-Output ("::notice title=Inno package version::" + ($versionOutput -replace '\r?\n', ' | '))
          if ($versionOutput -notmatch '(?im)^innosetup\|(6\.7\.[0-9]+)\s*$') { throw 'Cannot establish an Inno Setup 6.7 package version compatible with the pinned extractor' }
          $version = $Matches[1]
          $compilerSha = (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
          "KAYAN_INNO_VERSION=$version" >> $env:GITHUB_ENV
          "KAYAN_INNO_SHA256=$compilerSha" >> $env:GITHUB_ENV
          Write-Host "Inno compiler version=$version SHA256=$compilerSha"
      - name: Build product-mode Setup without a private key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\distribution\windows\build-installer.ps1 -DisposableSource
          if ($LASTEXITCODE -ne 0) { throw 'Product candidate build failed' }
          $file = Get-Item -LiteralPath 'build/windows-installer/KAYAN-ERP-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/inspect-windows-pe.mjs $file.FullName
          if ($LASTEXITCODE -ne 0) { throw 'PE inspection failed' }
          $record = [ordered]@{sourceCommit=$env:GITHUB_SHA; sha256=$hash; size=$file.Length; innoVersion=$env:KAYAN_INNO_VERSION; innoCompilerSha256=$env:KAYAN_INNO_SHA256}
          $record | ConvertTo-Json | Set-Content -LiteralPath 'build/windows-installer/build-evidence.json' -Encoding utf8
          Write-Host "Built candidate SHA256=$hash bytes=$($file.Length) source=$env:GITHUB_SHA; not yet verified or install-tested."
      - name: Pass candidate to independent inspection only
        uses: actions/upload-artifact@v4
        with:
          name: raw-internal-${{ github.sha }}
          path: |
            build/windows-installer/KAYAN-ERP-Setup.exe
            build/windows-installer/build-evidence.json
          if-no-files-found: error
          retention-days: 1

  inspect:
    name: Extract and verify the actual payload
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - run: node --test scripts/verify-extracted-windows-installer.test.mjs scripts/windows-release-policy.test.mjs
      - name: Install extractor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libboost-all-dev liblzma-dev zlib1g-dev libbz2-dev unzip
      - name: Build and verify pinned Inno 6.7-compatible extractor and fixtures
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/innoextract-src"
          git clone --no-checkout https://github.com/mplabsorg/innoextract.git "$src"
          git -C "$src" fetch --depth=1 origin refs/heads/support-inno-7.1
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = 34f65747e4a57d5de2582bb1ad3d540f440a3983
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build "$src/build" --parallel 2
          ctest --test-dir "$src/build" --output-on-failure
          extractor="$(find "$src/build" -type f -name innoextract -perm -111 -print -quit)"
          test -n "$extractor"
          "$extractor" --version
          sha256sum "$extractor"
          echo "KAYAN_INNOEXTRACT=$extractor" >> "$GITHUB_ENV"
          fixture_zip="$RUNNER_TEMP/fixtures.zip"
          curl -fsSL https://github.com/mplabsorg/innoextract/releases/download/format-fixtures-v1/innoextract-format-fixtures.zip -o "$fixture_zip"
          echo "d77d2c447dd46edaeab6b4ea5d7102000b0b8cd66970f18cea2b1eb20f21aa52  $fixture_zip" | sha256sum -c -
          unzip -q "$fixture_zip" -d "$RUNNER_TEMP"
          python3 "$src/tests/check-fixtures.py" --extractor "$extractor" --fixtures "$RUNNER_TEMP/format-fixtures" --output "$RUNNER_TEMP/fixture-results"
      - uses: actions/download-artifact@v4
        with:
          name: raw-internal-${{ github.sha }}
          path: candidate
      - name: Verify hash and source before extraction
        shell: bash
        run: |
          node -e "const fs=require('fs'),c=require('crypto'),e=JSON.parse(fs.readFileSync('candidate/build-evidence.json','utf8').replace(/^\\uFEFF/,'')),b=fs.readFileSync('candidate/KAYAN-ERP-Setup.exe'); if(e.sourceCommit!==process.env.GITHUB_SHA || e.sha256!==c.createHash('sha256').update(b).digest('hex') || e.size!==b.length) throw Error('Build evidence does not match EXE or source');"
      - name: Checksum-test and extract Inno payload
        shell: bash
        run: |
          set -euo pipefail
          "$KAYAN_INNOEXTRACT" --list --silent --exclude-temp --no-extract-unknown -- candidate/KAYAN-ERP-Setup.exe > candidate/inno-payload-list.txt
          test -s candidate/inno-payload-list.txt
          "$KAYAN_INNOEXTRACT" --extract --test --exclude-temp --no-extract-unknown --output-dir extracted-payload -- candidate/KAYAN-ERP-Setup.exe
      - name: Verify payload policy and production public key
        run: node scripts/verify-extracted-windows-installer.mjs --artifact candidate/KAYAN-ERP-Setup.exe --root extracted-payload --source-commit "${{ github.sha }}" --report candidate/payload-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: payload-inspected-internal-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Install and exercise the inspected Setup offline
    needs: inspect
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: payload-inspected-internal-${{ github.sha }}
          path: candidate
      - name: Check candidate provenance and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content -LiteralPath 'candidate/build-evidence.json' -Raw | ConvertFrom-Json
          $report = Get-Content -LiteralPath 'candidate/payload-verification.json' -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath 'candidate/KAYAN-ERP-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($build.sourceCommit -ne $env:GITHUB_SHA -or $report.sourceCommit -ne $env:GITHUB_SHA -or $build.sha256 -ne $actual -or $report.installer.sha256 -ne $actual) { throw 'Candidate SHA or source mismatch' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/smoke-test-installed-windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Smoke script PowerShell syntax errors' }
      - name: Install the exact product Setup and perform offline runtime checks
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File scripts/smoke-test-installed-windows.ps1 -SetupPath "$PWD\candidate\KAYAN-ERP-Setup.exe" -RuntimeOnly -ExpectedSourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime smoke failed' }
      - name: Record limitations and exact tested EXE hash
        shell: pwsh
        run: |
          $build = Get-Content 'candidate/build-evidence.json' -Raw | ConvertFrom-Json
          $hash = (Get-FileHash 'candidate/KAYAN-ERP-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $build.sha256) { throw 'Setup changed during smoke' }
          [ordered]@{sourceCommit=$env:GITHUB_SHA; installerSha256=$hash; result='offline-runtime-smoke-passed-not-release'; notTested=@('Licensed business operation with production public key','Packaged Windows generator with synthetic signing key')} | ConvertTo-Json -Depth 4 | Set-Content 'candidate/installation-smoke.json' -Encoding utf8
      - name: Upload install-tested candidate with explicit limitations
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-INSTALL-SMOKE-NOT-RELEASE-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
