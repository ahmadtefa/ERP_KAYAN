name: PR accounting and Windows build

# Independent code checks. No secrets, signing, installation or publication.
# These checks deliberately do not replace the blocked release evidence gate.
on:
  pull_request:
    branches: [main, 'arena/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accounting-and-packaging-policy:
    name: Accounting and non-signing packaging policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://synthetic@127.0.0.1:5432/kayan_unused?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout is the exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies without scripts
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        working-directory: backend
        run: npx prisma generate
      - name: Run accounting and posting tests
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        working-directory: backend
        run: >-
          npm test -- --runInBand
          src/modules/accounting/opening-balances.controller.spec.ts
          src/modules/accounting/opening-balances.service.spec.ts
          src/modules/accounting/posting.service.spec.ts
          src/modules/accounting/year-end-close.service.spec.ts
      - name: Test migration exit handling and non-signing payload policy
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: >-
          node --test
          backend/scripts/migrate-deploy.test.mjs
          scripts/windows-policy-non-signing.test.mjs
          scripts/windows-runtime-preflight.test.mjs
          scripts/windows-repair-semantics.test.mjs
          scripts/windows-payload-contract.test.mjs
      - name: Analyse bundled Windows scripts beyond syntax
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: node scripts/verify-windows-scripts.mjs

  windows-build:
    name: Build Windows application from exact head (no installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout is the exact source head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Checkout does not match the event source head.' }
          Write-Host "Source commit: $actual"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Syntax first: every bundled script must at least parse on the same
      # Windows PowerShell host Inno Setup invokes. The semantic check in the
      # Linux job then proves each block is actually reachable -- parsing alone
      # passed a repair path whose checks had silently become scriptblock
      # literals, so both checks are kept.
      - name: Parse every bundled Windows PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'distribution/windows' -Filter '*.ps1' -File -Recurse)
          if ($files.Count -eq 0) { throw 'No Windows PowerShell runtime scripts were found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              throw "PowerShell syntax error in $($file.FullName): $detail"
            }
          }
          Write-Host "PowerShell parser passed for $($files.Count) bundled scripts."
      - name: Build Windows application (not Setup)
        run: flutter build windows --release --no-pub
      - name: Verify output exists and record its hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/windows/x64/runner/Release/erp_kayan.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Windows executable not found.' }
          $file = Get-Item -LiteralPath $exe
          if ($file.Length -eq 0) { throw 'Windows executable is empty.' }
          Write-Host "Application executable bytes: $($file.Length)"
          Write-Host "Application executable SHA256: $((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host 'Not an installer, not an installed-product test, and not release evidence.'

  work-setup:
    name: Build product Setup for PR 79
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 79 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/bilingual-names-opening-balances'
    needs: [accounting-and-packaging-policy, windows-build]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Inno Setup compiler on the build host
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed.' }
      - name: Build offline Setup with the pinned product public key
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) { throw 'Checkout SHA mismatch.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout must be clean.' }
          & .\distribution\windows\build-installer.ps1 -DisposableSource
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed.' }
          $setup = Get-Item -LiteralPath 'build/windows-installer/KAYAN-ERP-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source: $env:EXPECTED_HEAD, bytes: $($setup.Length), SHA256: $hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-setup-internal-${{ github.event.pull_request.head.sha }}
          path: build/windows-installer/KAYAN-ERP-Setup.exe
          if-no-files-found: error
          retention-days: 1

  work-setup-inspection:
    name: Inspect PR 79 Setup payload
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 79 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/bilingual-names-opening-balances'
    needs: work-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install extractor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libboost-all-dev liblzma-dev zlib1g-dev libbz2-dev unzip
      - name: Build and verify pinned Inno 6.7-compatible extractor and fixtures
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/innoextract-src"
          git clone --no-checkout https://github.com/mplabsorg/innoextract.git "$src"
          git -C "$src" fetch --depth=1 origin refs/heads/support-inno-7.1
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = 34f65747e4a57d5de2582bb1ad3d540f440a3983
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build "$src/build" --parallel 2
          ctest --test-dir "$src/build" --output-on-failure
          extractor="$(find "$src/build" -type f -name innoextract -perm -111 -print -quit)"
          test -n "$extractor"
          "$extractor" --version
          sha256sum "$extractor"
          echo "KAYAN_INNOEXTRACT=$extractor" >> "$GITHUB_ENV"
          fixture_zip="$RUNNER_TEMP/fixtures.zip"
          curl -fsSL https://github.com/mplabsorg/innoextract/releases/download/format-fixtures-v1/innoextract-format-fixtures.zip -o "$fixture_zip"
          echo "d77d2c447dd46edaeab6b4ea5d7102000b0b8cd66970f18cea2b1eb20f21aa52  $fixture_zip" | sha256sum -c -
          unzip -q "$fixture_zip" -d "$RUNNER_TEMP"
          python3 "$src/tests/check-fixtures.py" --extractor "$extractor" --fixtures "$RUNNER_TEMP/format-fixtures" --output "$RUNNER_TEMP/fixture-results"
          echo "KAYAN_INNOEXTRACT_SHA256=$(sha256sum "$extractor" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-setup-internal-${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Inspect Setup and match payload provenance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          node scripts/inspect-final-inno.mjs --artifact candidate/KAYAN-ERP-Setup.exe --mode product \
            --extractor "$KAYAN_INNOEXTRACT" --extractor-sha256 "$KAYAN_INNOEXTRACT_SHA256" \
            --source-commit "$EXPECTED_HEAD" --report candidate/payload-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KAYAN-ERP-Setup-inspected-${{ github.event.pull_request.head.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
