name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build KAYAN ERP for Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read application version
        id: app-version
        shell: powershell
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw 'Could not read app version from pubspec.yaml' }
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer release version: $version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py

      - name: Enable Flutter Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $item = Get-Item -LiteralPath $iscc
          if ($item.VersionInfo.FileVersion) { Write-Host "Inno Setup compiler: $iscc (version $($item.VersionInfo.FileVersion))" }
          $global:LASTEXITCODE = 0

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Test backend
        working-directory: backend
        run: npm test -- --runInBand

      - name: Clean build backend
        working-directory: backend
        run: npm run build

      - name: Verify clean backend build outputs
        shell: powershell
        run: |
          $required = @('backend\dist\src\main.js', 'backend\dist\prisma\seed.js')
          foreach ($item in $required) { if (-not (Test-Path $item)) { throw "Required clean build output missing: $item" } }

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Build Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\distribution\windows\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }

      - name: Verify installer artifact
        shell: powershell
        run: |
          $setupCanonical = ".\build\windows-installer\KAYAN-ERP-Setup.exe"
          if (-not (Test-Path $setupCanonical)) { throw "Expected canonical installer EXE not found: $setupCanonical" }
          $files = @(Get-ChildItem .\build\windows-installer\KAYAN-ERP-Setup-*-x64.exe -File)
          if ($files.Count -lt 1) { throw "Expected at least one versioned installer EXE; found $($files.Count)." }
          Get-FileHash $setupCanonical, $files[0].FullName -Algorithm SHA256 | Format-List Algorithm, Hash, Path

      - name: Smoke-test the actual installed Windows application
        shell: powershell
        run: .\scripts\smoke-test-installed-windows.ps1 -SetupPath .\build\windows-installer\KAYAN-ERP-Setup.exe

      - name: Collect installer diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = Join-Path $env:RUNNER_TEMP 'kayan-installer-diagnostics'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $sources = @(
            (Join-Path $env:TEMP 'kayan-setup-smoke.log'),
            (Join-Path $env:TEMP 'kayan-installer-prep-stdout.log'),
            (Join-Path $env:TEMP 'kayan-installer-prep-stderr.log'),
            (Join-Path $env:ProgramData 'KAYAN-ERP\logs'),
            (Join-Path $env:APPDATA 'KAYAN-ERP\logs')
          )
          foreach ($source in $sources) {
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem $dest -Recurse -File | ForEach-Object {
            (Get-Content -LiteralPath $_.FullName -Raw) -replace '(?i)postgres(?:ql)?://[^\s"'']+', '[DATABASE URL REDACTED]' |
              Set-Content -LiteralPath $_.FullName -Encoding UTF8
          }
        continue-on-error: true

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kayan-installer-diagnostics
          path: ${{ runner.temp }}/kayan-installer-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish direct Setup.exe download
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ncipollo/release-action@v1
        with:
          tag: windows-v${{ steps.app-version.outputs.version }}
          name: KAYAN ERP Windows ${{ steps.app-version.outputs.version }}
          artifacts: build/windows-installer/KAYAN-ERP-Setup.exe
          artifactContentType: application/vnd.microsoft.portable-executable
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer (diagnostic build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-Windows-x64-Installer
          path: |
            build/windows-installer/KAYAN-ERP-Setup.exe
            build/windows-installer/KAYAN-ERP-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
