name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KAYAN ERP for Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read application version
        id: app-version
        shell: powershell
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw 'Could not read app version from pubspec.yaml' }
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer release version: $version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py

      - name: Compile RepairTool.exe (early check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'RepairTool.exe'
          .\distribution\windows\build-repair-tool.ps1 -OutputPath $output -IconPath '.\windows\runner\resources\app_icon.ico'
          $item = Get-Item -LiteralPath $output
          Write-Host "RepairTool.exe compiled early: $($item.Length) bytes"

      - name: Enable Flutter Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $item = Get-Item -LiteralPath $iscc
          if ($item.VersionInfo.FileVersion) { Write-Host "Inno Setup compiler: $iscc (version $($item.VersionInfo.FileVersion))" }
          $global:LASTEXITCODE = 0

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Test backend
        working-directory: backend
        run: npm test -- --runInBand

      - name: Clean build backend
        working-directory: backend
        run: npm run build

      - name: Verify clean backend build outputs
        shell: powershell
        run: |
          $required = @('backend\dist\src\main.js', 'backend\dist\prisma\seed.js')
          foreach ($item in $required) { if (-not (Test-Path $item)) { throw "Required clean build output missing: $item" } }

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: python scripts/ci-diagnose.py flutter analyze

      # Same screenshot generation as the ERP CI jobs: the design-screenshot
      # goldens are not committed, so they must be rendered in this job's own
      # workspace before the test run below compares against them. Without
      # this step every Windows run failed at "Test Flutter" with missing
      # golden files even when all real tests passed on Linux.
      - name: Render design screenshots
        run: flutter test test/screenshots/design_screenshots_test.dart --update-goldens

      - name: Test Flutter
        run: python scripts/ci-diagnose.py flutter test --reporter expanded

      - name: Build Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\distribution\windows\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }

      - name: Verify installer artifact
        shell: powershell
        run: |
          $setupCanonical = ".\build\windows-installer\KAYAN-ERP-Setup.exe"
          if (-not (Test-Path $setupCanonical)) { throw "Expected canonical installer EXE not found: $setupCanonical" }
          $files = @(Get-ChildItem .\build\windows-installer\KAYAN-ERP-Setup-*-x64.exe -File)
          if ($files.Count -lt 1) { throw "Expected at least one versioned installer EXE; found $($files.Count)." }
          Get-FileHash $setupCanonical, $files[0].FullName -Algorithm SHA256 | Format-List Algorithm, Hash, Path
          $canonicalHash = (Get-FileHash $setupCanonical -Algorithm SHA256).Hash
          Write-Host "::notice title=Installer SHA256::KAYAN-ERP-Setup.exe SHA256=$canonicalHash"

      - name: Smoke-test the actual installed Windows application
        shell: powershell
        run: .\scripts\smoke-test-installed-windows.ps1 -SetupPath .\build\windows-installer\KAYAN-ERP-Setup.exe

      - name: Publish direct Setup.exe download
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ncipollo/release-action@v1
        with:
          tag: windows-v${{ steps.app-version.outputs.version }}
          name: KAYAN ERP Windows ${{ steps.app-version.outputs.version }}
          artifacts: build/windows-installer/KAYAN-ERP-Setup.exe
          artifactContentType: application/vnd.microsoft.portable-executable
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # A branch build publishes the same Setup.exe as a prerelease, so it
      # can be handed over with a direct .exe download address before
      # anything reaches main. Manual dispatches qualify on any branch;
      # pull-request builds qualify only for the handover branch named
      # below (the automation token cannot dispatch workflows itself).
      # Everywhere else a pull-request build only uploads the diagnostic
      # artifact further down; the official release above stays main-only.
      - name: Publish branch prerelease with direct Setup.exe download
        if: (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'arena/13bf1607-erp-kayan')
        uses: ncipollo/release-action@v1
        with:
          tag: windows-v${{ steps.app-version.outputs.version }}-pre-${{ github.run_id }}
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          name: KAYAN ERP Windows ${{ steps.app-version.outputs.version }} (branch build ${{ github.run_id }})
          artifacts: build/windows-installer/KAYAN-ERP-Setup.exe
          artifactContentType: application/vnd.microsoft.portable-executable
          prerelease: true
          makeLatest: false
          body: |
            Automatic branch build for testing and handover. This is not an
            official release; the official download is published from main.

            Branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
            Commit: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer (diagnostic build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-Windows-x64-Installer
          path: |
            build/windows-installer/KAYAN-ERP-Setup.exe
          if-no-files-found: error
          retention-days: 14
