name: Finalize quotation design
on:
  push:
    branches: [arena/24dd290b-erp-kayan]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/24dd290b-erp-kayan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final quotation design
        run: python scripts/finalize-quotation-design.py
      - name: Validate changed source syntax
        run: |
          python -m py_compile scripts/finalize-quotation-design.py
          cd backend && npm ci --ignore-scripts && npx prisma generate && npx tsc --noEmit
      - name: Commit source changes and remove one-shot files
        run: |
          rm -f scripts/finalize-quotation-design.py .github/workflows/finalize-quotation-design.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib backend scripts .github/workflows/finalize-quotation-design.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: complete per-element quotation design controls'
          git push origin HEAD:arena/24dd290b-erp-kayan
