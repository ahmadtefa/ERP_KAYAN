name: Temporary smoke auth fix
on:
  push:
    branches: ['fix/inno-inspector-callsites-20261030']
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'ci: fix authenticated license smoke checks' && github.event.head_commit.message != 'ci: remove temporary smoke auth fix' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Patch smoke checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke-test-installed-windows.ps1')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Invoke-RestMethod -Uri "$base/license/status" -TimeoutSec 15': 'Invoke-RestMethod -Uri "$base/license/status" -Headers $headers -TimeoutSec 15',
              'Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri "$base/license/status" -TimeoutSec 15': 'Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri "$base/license/status" -Headers $headers -TimeoutSec 15',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-test-installed-windows.ps1
          git commit -m 'ci: fix authenticated license smoke checks'
          git push
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD:.github/workflows/_temporary-smoke-auth-fix.yml)
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/_temporary-smoke-auth-fix.yml" \
            -f message='ci: remove temporary smoke auth fix' \
            -f sha="$sha" \
            -f branch="$GITHUB_REF_NAME"
