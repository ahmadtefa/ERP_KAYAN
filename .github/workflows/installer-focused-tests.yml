name: Standalone nine location bridge qualification

# Branch-only manual qualification, not comprehensive acceptance or a product
# build. No Windows install, signing, key generation, release or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridges:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KAYAN_BRIDGE_EVIDENCE_DIR: ${{ github.workspace }}/build/bridge-evidence
      KAYAN_VISUAL_OUTPUT: ${{ github.workspace }}/build/bridge-evidence/pixels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Install locked backend dependencies and generate Prisma
        working-directory: backend
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
      - name: Resolve locked Flutter packages
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: flutter pub get --enforce-lockfile
      - name: Check bridge evidence refusal rules and workflow safety
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          node --test scripts/verify-location-bridge-evidence.test.mjs backend/scripts/bridge-harness.test.cjs backend/scripts/isolated-pg-cluster.test.cjs
          node scripts/ci-workflow-safety.test.cjs
      - name: Compile backend without product packaging
        working-directory: backend
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: npx tsc -p tsconfig.json
      - name: Run six selected PGlite HTTP bridges sequentially
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          export FLUTTER_BIN="$(command -v flutter)"
          mkdir -p "$KAYAN_BRIDGE_EVIDENCE_DIR"
          for bridge in receipt transfer purchase sales stockdoc count; do
            node scripts/run-location-pglite-bridge.mjs "$bridge" "$KAYAN_BRIDGE_EVIDENCE_DIR"
          done
      - name: Run three selected native isolated HTTP bridges
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: |
          export FLUTTER_BIN="$(command -v flutter)"
          node scripts/run-location-native-bridges.mjs "$KAYAN_BRIDGE_EVIDENCE_DIR"
      - name: Verify all nine child and parent SQL outcomes
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        run: node scripts/verify-location-bridge-evidence.mjs "$KAYAN_BRIDGE_EVIDENCE_DIR" "$KAYAN_BRIDGE_EVIDENCE_DIR/report.json"
      - name: Preserve raw selected evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: location-bridge-evidence-${{ github.sha }}
          path: build/bridge-evidence/
          if-no-files-found: warn
          retention-days: 7
