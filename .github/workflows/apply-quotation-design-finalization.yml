name: Apply quotation design finalization
on:
  push:
    branches:
      - arena/24dd290b-erp-kayan
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/24dd290b-erp-kayan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe source transformations
        run: python scripts/apply-quotation-design-finalization.py
      - name: Remove one-shot automation
        run: rm -f scripts/apply-quotation-design-finalization.py .github/workflows/apply-quotation-design-finalization.yml
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib backend scripts .github/workflows/apply-quotation-design-finalization.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: complete quotation per-element design controls'
          git push origin HEAD:arena/24dd290b-erp-kayan
