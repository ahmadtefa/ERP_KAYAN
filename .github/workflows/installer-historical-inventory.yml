name: Historical installer inventory (read-only)

on:
  push:
    branches: ['arena/2d794f08-erp-kayan']
    paths:
      - '.github/workflows/installer-historical-inventory.yml'
      - 'scripts/inventory-historical-artifact.py'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Ubuntu's Inno extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends innoextract
      - name: Inspect historical artifact without extraction or installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inventory-historical-artifact.py
      # No build, installer execution, releases, or uploads are permitted here.
