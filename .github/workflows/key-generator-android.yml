name: Key Generator (Android APK)

# The Android build of the supplier's key generator: the same tool, the same key
# format, the same register files as KAYAN-Key-Generator.exe. This workflow
# builds the APK on a real runner, runs the Dart tests, and then proves the two
# implementations agree in both directions:
#
#   the app   -> the product's own verifier and the Windows generator
#   Windows   -> the app's verifier
#
# It has no release step and no signing keystore: the APK is signed with the
# standard debug key so it can be side-loaded for testing. Publishing to a store
# needs a keystore decision made outside this file.
#
# No production key is involved anywhere: the cross-check generates a throwaway
# key pair in a temporary folder.

on:
  pull_request:
    branches: [main, 'arena/**']
    paths:
      - 'tools/license-generator/android-app/**'
      - '.github/workflows/key-generator-android.yml'
  push:
    branches: ['arena/**']
    paths:
      - 'tools/license-generator/android-app/**'
      - '.github/workflows/key-generator-android.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Also boot an Android emulator, install the APK and launch it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: key-generator-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  APP_DIR: tools/license-generator/android-app

jobs:
  # One-off: `flutter create` writes the Gradle wrapper and the manifest that no
  # one should type by hand. When the project is missing, this job generates it
  # and commits it, so every later run is an ordinary `flutter build apk`. When
  # it is already there, the job does nothing.
  scaffold:
    name: Create the Android project from the Flutter template
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Is there already an android project?
        id: check
        run: |
          if [ -d "${{ env.APP_DIR }}/android" ]; then
            echo 'need=false' >> "$GITHUB_OUTPUT"
            echo '::notice::the android project is already in the repository'
          else
            echo 'need=true' >> "$GITHUB_OUTPUT"
            echo '::notice::no android project yet; generating it from the Flutter template'
          fi

      - name: Set up Flutter
        if: steps.check.outputs.need == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generated in a scratch folder and copied in, never run over this
      # package: `flutter create .` would rewrite files that are not its own.
      - name: Generate the android/ project
        if: steps.check.outputs.need == 'true'
        run: |
          flutter --version
          rm -rf "$RUNNER_TEMP/scaffold"
          flutter create --platforms=android --org com.kayan \
            --project-name kayan_key_generator "$RUNNER_TEMP/scaffold"
          cp -a "$RUNNER_TEMP/scaffold/android" "${{ env.APP_DIR }}/android"
          cp "$RUNNER_TEMP/scaffold/.metadata" "${{ env.APP_DIR }}/.metadata"
          manifest="${{ env.APP_DIR }}/android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="kayan_key_generator"/android:label="KAYAN Key Generator"/' "$manifest"
          grep -n 'android:label' "$manifest"
          ls -la "${{ env.APP_DIR }}/android"

      - name: Commit the generated project
        if: steps.check.outputs.need == 'true'
        run: |
          git config user.name 'Arena Agent'
          git config user.email 'agent@arena.ai'
          git add -A "${{ env.APP_DIR }}"
          if git diff --cached --quiet; then
            echo '::notice::nothing to commit'
            exit 0
          fi
          git commit \
            -m 'Key generator (Android): the android/ project, from the Flutter template' \
            -m 'Generated by the Flutter SDK on the runner rather than typed by hand, so the Gradle wrapper and the manifest match the SDK version CI builds with.'
          git push

  apk:
    name: Build and test KAYAN-Key-Generator.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install Dart and Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: python ../../../scripts/ci-diagnose.py flutter analyze

      - name: Test (golden vectors, licensing rules, the window)
        working-directory: ${{ env.APP_DIR }}
        run: python ../../../scripts/ci-diagnose.py flutter test --reporter expanded

      # ── the two implementations must agree, in both directions ──────────
      - name: Set up Node.js for the cross-check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the product's licensing code
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npx tsc -p tsconfig.json
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan?schema=public
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'

      - name: Issue keys with the app's code
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/dart_side.dart emit "$RUNNER_TEMP/cross"

      - name: Verify them with the product and with the Windows generator
        working-directory: ${{ env.APP_DIR }}
        run: node tool/verify_with_product.mjs "$RUNNER_TEMP/cross"

      - name: Verify the Windows tool's key with the app's code
        working-directory: ${{ env.APP_DIR }}
        run: |
          key="$(cat "$RUNNER_TEMP/cross/node-key.txt")"
          dart run tool/dart_side.dart verify "$RUNNER_TEMP/cross/keyring" "$key"

      # ── the APK ─────────────────────────────────────────────────────────
      - name: The android/ project must exist
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d android ]; then
            echo '::error::tools/license-generator/android-app/android is missing. The scaffold job adds it; if that failed, this job cannot build an APK.'
            exit 1
          fi

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}
        run: python ../../../scripts/ci-diagnose.py flutter build apk --release

      - name: Inspect what is inside the APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk" || { echo '::error::the APK was not produced'; exit 1; }
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt2="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -1)aapt2"
          echo '── manifest ──'
          "$aapt2" dump badging "$apk" \
            | grep -E "^(package|application-label|launchable-activity|sdkVersion|targetSdkVersion)" \
            | tee "$RUNNER_TEMP/badging.txt"
          echo '── contents ──'
          unzip -l "$apk" \
            | grep -E "classes.*\.dex|libflutter|libapp|AndroidManifest" \
            | tee "$RUNNER_TEMP/contents.txt"
          # The tool must not carry a signing key of its own.
          if unzip -p "$apk" 2>/dev/null | grep -a -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo '::error::a PEM private key was found inside the APK'
            exit 1
          fi
          echo 'no private key inside the APK'
          grep -q 'launchable-activity' "$RUNNER_TEMP/badging.txt" \
            || { echo '::error::the APK has no launchable activity'; exit 1; }
          grep -q 'arm64-v8a' "$RUNNER_TEMP/contents.txt" \
            || { echo '::error::the APK carries no arm64 native library'; exit 1; }

      - name: Name the artifact for the operator
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/key-generator-android"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-release.apk "$out/KAYAN-Key-Generator-Android.apk"
          cp "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/contents.txt" "$out/"
          {
            echo "KAYAN key generator - Android APK"
            echo "built at      : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package       : $(grep -m1 '^package' "$RUNNER_TEMP/badging.txt" || echo unknown)"
            echo "flutter       : $(flutter --version | head -1)"
            echo "size          : $(stat -c%s "$out/KAYAN-Key-Generator-Android.apk") bytes"
            echo "sha256        : $(sha256sum "$out/KAYAN-Key-Generator-Android.apk" | cut -d' ' -f1)"
            echo
            echo "This package contains no signing key. The operator imports the key folder."
            echo "Signed with the standard debug key: side-load it, do not publish it to a store."
          } > "$out/BUILD-INFO.txt"
          cat "$out/BUILD-INFO.txt"

      - name: Report the result on the run
        if: always()
        run: |
          info="$GITHUB_WORKSPACE/dist/key-generator-android/BUILD-INFO.txt"
          if [ -f "$info" ]; then
            summary="$(grep -E '^(package|size|sha256)' "$info" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            echo "::notice title=Key generator APK::${summary}"
          else
            echo '::warning::the APK was not produced'
          fi

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-Key-Generator-Android-apk
          path: dist/key-generator-android/
          if-no-files-found: warn
          retention-days: 30

  # Not part of every run: an emulator costs ten minutes and needs a runner that
  # allows hardware acceleration. Asked for explicitly, it installs the built APK
  # on Android and starts it - the only evidence short of a phone.
  emulator:
    name: Install and launch the APK on Android
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Can this runner accelerate an emulator?
        run: |
          ls -l /dev/kvm || echo 'no /dev/kvm on this runner'
      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get && flutter build apk --release
      - name: Boot Android, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
            adb shell am start -W -n com.kayan.kayan_key_generator/.MainActivity
            sleep 20
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | head -3
            adb shell pidof com.kayan.kayan_key_generator
            adb exec-out screencap -p > launched.png
            adb shell dumpsys package com.kayan.kayan_key_generator | grep -E 'versionName|firstInstallTime' | head -3
      - name: Keep the screenshot as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-Key-Generator-Android-launched
          path: launched.png
          if-no-files-found: warn
          retention-days: 30
