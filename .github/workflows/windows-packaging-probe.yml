name: Unreleased Windows trial packaging only

# Branch-only trial route using a registered workflow path.
# Independent from comprehensive acceptance, which remains required for a green
# application claim. No install, key generation, signing, deployment or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-evaluation:
    name: Build licence-protected Setup on disposable Windows runner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Install Inno Setup on disposable runner
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build licence-protected Setup
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Source checkout is not clean.' }
          $operatorKey = @('.\distribution\windows\public-key.pem', '.\distribution\windows\licensing\public-key.pem') |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $operatorKey) { throw 'The approved licence public key is missing.' }
          & node .\scripts\license-build-policy.mjs --mode product --public-key $operatorKey
          if ($LASTEXITCODE -ne 0) { throw 'Licence public key validation failed.' }
          & .\distribution\windows\build-installer.ps1 -DisposableSource -Output 'build\windows-evaluation-setup'
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed.' }
          $setup = Get-Item -LiteralPath 'build\windows-evaluation-setup\KAYAN-ERP-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{ sourceCommit = (git rev-parse HEAD).Trim(); mode = 'product-build-unreleased'; name = $setup.Name; bytes = $setup.Length; sha256 = $hash; createdUtc = $setup.CreationTimeUtc.ToString('o') } |
            ConvertTo-Json | Set-Content -LiteralPath 'build\windows-evaluation-setup\identity.json' -Encoding utf8
      - name: Upload unreleased Setup and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kayan-unreleased-setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/windows-evaluation-setup/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Setup identity separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kayan-setup-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/windows-evaluation-setup/identity.json
          if-no-files-found: warn
          retention-days: 7

  # Extraction, not installation: the Setup built above is unpacked on Linux with
  # the pinned, fixture-tested extractor already used by windows-installer.yml
  # and its payload is verified. Nothing is installed or run.
  inspect-final:
    name: Extract and verify the actual payload
    needs: windows-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - name: Install extractor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libboost-all-dev liblzma-dev zlib1g-dev libbz2-dev unzip
      - name: Build and verify pinned Inno 6.7-compatible extractor and fixtures
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/innoextract-src"
          git clone --no-checkout https://github.com/mplabsorg/innoextract.git "$src"
          git -C "$src" fetch --depth=1 origin refs/heads/support-inno-7.1
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = 34f65747e4a57d5de2582bb1ad3d540f440a3983
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build "$src/build" --parallel 2
          ctest --test-dir "$src/build" --output-on-failure
          extractor="$(find "$src/build" -type f -name innoextract -perm -111 -print -quit)"
          test -n "$extractor"
          "$extractor" --version
          sha256sum "$extractor"
          echo "KAYAN_INNOEXTRACT=$extractor" >> "$GITHUB_ENV"
          fixture_zip="$RUNNER_TEMP/fixtures.zip"
          curl -fsSL https://github.com/mplabsorg/innoextract/releases/download/format-fixtures-v1/innoextract-format-fixtures.zip -o "$fixture_zip"
          echo "d77d2c447dd46edaeab6b4ea5d7102000b0b8cd66970f18cea2b1eb20f21aa52  $fixture_zip" | sha256sum -c -
          unzip -q "$fixture_zip" -d "$RUNNER_TEMP"
          python3 "$src/tests/check-fixtures.py" --extractor "$extractor" --fixtures "$RUNNER_TEMP/format-fixtures" --output "$RUNNER_TEMP/fixture-results"
          echo "KAYAN_INNOEXTRACT_SHA256=$(sha256sum "$extractor" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: kayan-unreleased-setup-${{ github.sha }}
          path: candidate
      - name: Inspect the final Inno including temporary payload files
        shell: bash
        run: |
          set -euo pipefail
          ls -l candidate
          sha256sum candidate/KAYAN-ERP-Setup.exe
          node scripts/inspect-final-inno.mjs --artifact candidate/KAYAN-ERP-Setup.exe --mode product \
            --extractor "$KAYAN_INNOEXTRACT" --extractor-sha256 "$KAYAN_INNOEXTRACT_SHA256" \
            --source-commit "$GITHUB_SHA" --report candidate/payload-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-payload-report-${{ github.sha }}
          path: candidate/payload-verification.json
          if-no-files-found: error
          retention-days: 7
