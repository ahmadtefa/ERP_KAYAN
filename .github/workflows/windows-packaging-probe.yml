name: Unreleased Windows trial packaging only

# Branch-only trial route using a registered workflow path.
# Independent from comprehensive acceptance, which remains required for a green
# application claim. No install, key generation, signing, deployment or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-evaluation:
    name: Build licence-protected Setup on disposable Windows runner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Install Inno Setup on disposable runner
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build licence-protected Setup
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-no-signing.cjs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Source checkout is not clean.' }
          $operatorKey = @('.\distribution\windows\public-key.pem', '.\distribution\windows\licensing\public-key.pem') |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $operatorKey) { throw 'The approved licence public key is missing.' }
          & node .\scripts\license-build-policy.mjs --mode product --public-key $operatorKey
          if ($LASTEXITCODE -ne 0) { throw 'Licence public key validation failed.' }
          & .\distribution\windows\build-installer.ps1 -DisposableSource -Output 'build\windows-evaluation-setup'
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed.' }
          $setup = Get-Item -LiteralPath 'build\windows-evaluation-setup\KAYAN-ERP-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{ sourceCommit = (git rev-parse HEAD).Trim(); mode = 'product-build-unreleased'; name = $setup.Name; bytes = $setup.Length; sha256 = $hash; createdUtc = $setup.CreationTimeUtc.ToString('o') } |
            ConvertTo-Json | Set-Content -LiteralPath 'build\windows-evaluation-setup\identity.json' -Encoding utf8
      # Extraction, not installation. The payload is a tree, and the only
      # honest way to check it is to unpack the package without running its
      # installer: a silent install would create services, write to ProgramData
      # and leave the runner in a state nobody asked for.
      - name: Build the pinned extractor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.9 https://github.com/dscharrer/innoextract.git "$RUNNER_TEMP/innoextract-src"
          cmake -S "$RUNNER_TEMP/innoextract-src" -B "$RUNNER_TEMP/innoextract-build" \
            -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=ON
          cmake --build "$RUNNER_TEMP/innoextract-build" --parallel 2
          find "$RUNNER_TEMP/innoextract-build" -name 'innoextract' -type f -perm -u+x

      - name: Extract the built Setup
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          extractor="$(find "$RUNNER_TEMP/innoextract-build" -name 'innoextract' -type f -perm -u+x | head -1)"
          test -n "$extractor"
          sha256sum "$extractor"
          mkdir -p "$RUNNER_TEMP/kayan-extracted"
          "$extractor" --silent --lowercase --output-dir "$RUNNER_TEMP/kayan-extracted" \
            'build/windows-evaluation-setup/KAYAN-ERP-Setup.exe'
          test -d "$RUNNER_TEMP/kayan-extracted"
          echo "dir=$RUNNER_TEMP/kayan-extracted" >> "$GITHUB_OUTPUT"

      - name: Verify the extracted payload
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/verify-extracted-windows-installer.mjs \
            --artifact 'build/windows-evaluation-setup/KAYAN-ERP-Setup.exe' \
            --root "${{ steps.extract.outputs.dir }}" \
            --source-commit "${{ github.sha }}" \
            --report "$RUNNER_TEMP/payload-report.json"

      - name: Report what the payload contains
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.extract.outputs.dir }}'
          echo '::notice title=Payload checks::runtime expectations against the extracted tree'
          node --experimental-transform-types scripts/verify-installed-runtime.mjs "$root" || \
            echo '::warning title=Runtime expectations::verify-installed-runtime reported a problem; see the step log'

          echo '── migration.sql files in the package ──'
          find "$root" -name 'migration.sql' | wc -l
          echo '── migration folders ──'
          find "$root" -type d -path '*prisma/migrations/*' -maxdepth 6 | wc -l
          echo '── runtimes present ──'
          find "$root" \( -name 'node.exe' -o -name 'pg_ctl.exe' -o -name 'pg_dump.exe' -o -name 'pg_restore.exe' -o -name 'erp_kayan.exe' -o -name 'RepairTool.exe' \) | sort

          echo '── nothing empty or a stub ──'
          # A file that exists but is zero bytes is not "present" in any useful
          # sense; the installer would fail at the customer.
          empties=0
          for required in \
            backend/scripts/apply-migrations.mjs \
            backend/scripts/prepare-database.mjs \
            backend/scripts/migrate-deploy.mjs \
            backend/node/node.exe \
            backend/postgres/bin/pg_ctl.exe \
            backend/postgres/bin/pg_dump.exe \
            backend/postgres/bin/pg_restore.exe \
            remove-everything.ps1 \
            remove-runtime.ps1 \
            RepairTool.exe \
            erp_kayan.exe; do
            file="$root/$required"
            if [ ! -s "$file" ]; then
              echo "MISSING OR EMPTY: $required"
              empties=$((empties + 1))
            else
              printf '  %8s  %s\n' "$(stat -c%s "$file")" "$required"
            fi
          done
          test "$empties" -eq 0

          echo '── no private key anywhere in the package ──'
          if grep -rlI --include='*.pem' --include='*.key' --include='*.txt' \
               'BEGIN .*PRIVATE KEY' "$root" 2>/dev/null | head -5 | grep -q .; then
            echo 'A private key is inside the payload'
            exit 1
          fi
          echo 'no private key found'

      - name: Upload unreleased Setup and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kayan-unreleased-setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/windows-evaluation-setup/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Setup identity separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kayan-setup-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/windows-evaluation-setup/identity.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the payload inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-payload-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/payload-report.json
          if-no-files-found: warn
          retention-days: 7
