name: Licence startup and payload focused checks

on:
  push:
    branches: ['arena/2d794f08-erp-kayan']
    paths:
      - '.github/workflows/licence-startup-focused.yml'
      - 'lib/core/backend/local_backend_io.dart'
      - 'test/core/backend/local_backend_io_test.dart'
      - 'scripts/verify-extracted-windows-installer.mjs'
      - 'scripts/verify-extracted-windows-installer.test.mjs'

permissions:
  contents: read

jobs:
  payload-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - run: node --test scripts/verify-extracted-windows-installer.test.mjs
  desktop-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub lib/core/backend/local_backend_io.dart test/core/backend/local_backend_io_test.dart
      - run: flutter test --no-pub test/core/backend/local_backend_io_test.dart
