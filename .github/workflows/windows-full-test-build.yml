name: Windows full ERP test build

on:
  push:
    branches:
      - build/windows-test-d3f62e97
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kayan-windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build complete KAYAN ERP installer (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: $actual" }
          Write-Host "Building exact source commit: $actual"

      - name: Set up Node.js for the build tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up the Flutter version used by the project lockfile
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Ensure Inno Setup 6 is available on the disposable build runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path -LiteralPath $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Inno Setup compiler was not found after setup.' }
          $version = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          Write-Host "Inno Setup compiler available: $iscc (version $version)"

      - name: Build the full product-mode Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\distribution\windows\build-installer.ps1 -DisposableSource
          if ($LASTEXITCODE -ne 0) { throw "KAYAN installer build failed with exit code $LASTEXITCODE." }

      - name: Verify installer, embedded runtime manifest and source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/windows-installer/KAYAN-ERP-Setup.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'The complete KAYAN ERP installer was not produced.' }
          node scripts/inspect-windows-pe.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Independent Windows PE inspection failed.' }

          $manifests = @(Get-ChildItem -LiteralPath 'build/windows-installer-stage' -Filter 'runtime-manifest.json' -File -Recurse)
          $matching = @()
          foreach ($file in $manifests) {
            $candidate = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            if ($candidate.sourceCommit -eq $env:GITHUB_SHA) { $matching += ,@{Path=$file.FullName; Data=$candidate} }
          }
          if ($matching.Count -ne 1) { throw "Expected exactly one runtime manifest for source $env:GITHUB_SHA; found $($matching.Count)." }
          $manifest = $matching[0].Data
          if ($manifest.product -ne 'KAYAN ERP' -or $manifest.architecture -ne 'x64') { throw 'Runtime manifest product or architecture mismatch.' }
          if ($manifest.licenseBuildKind -ne 'product' -or $manifest.licenseEnforcement -ne 'enforce') { throw 'Installer is not a production-key-enforced product build.' }
          if (-not $manifest.licensePublicKeySha256) { throw 'Embedded licence public-key fingerprint is missing.' }

          $item = Get-Item -LiteralPath $exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $evidence = [ordered]@{
            result = 'windows-x64-installer-built-and-pe-inspected'
            sourceCommit = $env:GITHUB_SHA
            installer = $item.Name
            sizeBytes = $item.Length
            sha256 = $hash
            productVersion = $manifest.productVersion
            architecture = $manifest.architecture
            nodeVersion = $manifest.nodeVersion
            postgresqlVersion = $manifest.postgresqlVersion
            flutterVersion = $manifest.flutterVersion
            licenseBuildKind = $manifest.licenseBuildKind
            licenseEnforcement = $manifest.licenseEnforcement
            licensePublicKeySha256 = $manifest.licensePublicKeySha256
            windowsInstallSmokeTested = $false
            releaseApproved = $false
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'build/windows-installer/build-evidence.json' -Encoding utf8
          "### KAYAN ERP Windows x64 build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Source commit: `$env:GITHUB_SHA`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Installer: `$($item.Name)`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Size: $($item.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- SHA-256: `$hash`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Product licensing: enforced with the repository's approved public key" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Native install/runtime smoke test: not performed by this workflow" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Release publication: not performed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload complete Windows installer for user testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KAYAN-ERP-Windows-x64-Full-Test-Build-${{ github.sha }}
          path: |
            build/windows-installer/KAYAN-ERP-Setup.exe
            build/windows-installer/build-evidence.json
            build/windows-installer/iscc.log
          if-no-files-found: error
          retention-days: 14
