name: KAYAN invoice stock refusal UI proof

# Targeted Flutter proof for the invoice over-stock refusal: the editor keeps
# what was typed, the refusal shows the server's reason with the item and the
# quantities, and the corrected save goes through. Dispatch only, so a push
# never starts it. flutter analyze plus three test files; nothing is built.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoice-stock-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Invoice stock refusal widget and resolver tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The app's pubspec pulls generated localizations and icons, which the
      # build step of the main CI produces before `flutter test` can compile.
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py

      # Pinned to the same Flutter as safe-checks.yml, code-integrity.yml and
      # the Windows workflows. `channel: stable` floats: once stable moved to
      # 3.48, `package:flutter/material.dart` became a deprecated member and
      # `flutter analyze` reported ~190 infos and exited 1, so every step after
      # Analyze was skipped. Pinning keeps this gate reproducible and equal to
      # what the release workflows actually build with.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Same wrapper the main CI uses: it turns a failing test's own message
      # into an annotation, because run logs are not always reachable.
      # A bare `analyze` covers the whole package, which is what the main CI
      # runs; narrowing it to three paths would hide a knock-on error in a
      # file that imports the screen.
      - name: Analyze
        run: python scripts/ci-diagnose.py flutter analyze

      - name: Run test/core/error/app_error_text_test.dart
        run: |
          python scripts/ci-diagnose.py flutter test \
            test/core/error/app_error_text_test.dart \
            --reporter expanded

      - name: Run test/widget/invoice_stock_short_error_test.dart
        run: |
          python scripts/ci-diagnose.py flutter test \
            test/widget/invoice_stock_short_error_test.dart \
            --reporter expanded

      - name: Run test/widget/invoice_line_field_errors_test.dart
        run: |
          python scripts/ci-diagnose.py flutter test \
            test/widget/invoice_line_field_errors_test.dart \
            --reporter expanded
