name: diag-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run the single diagnostic test and publish its errors
        shell: bash
        run: bash .diag/run.sh
