name: ERP KAYAN CI

on:
  pull_request:
    branches: [main, 'arena/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (real Prisma and PostgreSQL smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      KAYAN_ADMIN_USERNAME: ci-admin
      KAYAN_ADMIN_PASSWORD: CI-only-Admin-Password-12345
      PORT: 3000
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # The service container is PostgreSQL 16, and a dump carries the version
      # of the pg_dump that wrote it: a newer client writes SET statements the
      # 16 server rejects ("unrecognized configuration parameter
      # transaction_timeout"), which turns a rehearsal into a false alarm.
      # Install the matching client explicitly instead of trusting whichever
      # version the runner image happens to preinstall.
      - name: Install PostgreSQL 16 client tools to match the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run unit tests
        # `| tee` reports tee's exit status, not the test run's, so without
        # `-o pipefail` a failing suite would leave this step green and the
        # whole job would pass. The log is kept because the summary step below
        # reads it.
        run: python ../scripts/ci-diagnose.py bash -o pipefail -c 'npm test -- --runInBand 2>&1 | tee /tmp/kayan-jest.log'
      - name: Record unit-test totals
        if: always()
        run: |
          summary=$(grep -hE "^(Test Suites|Tests):" /tmp/kayan-jest.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Unit tests::${summary:-summary not captured}"
      - name: Build API
        run: npm run build
      - name: Apply migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy

      # Licensing is the one subsystem whose real behaviour cannot be shown
      # with a mocked database: the migration has to survive an installation
      # that already has accounts, seats have to be refused at the limit, two
      # simultaneous creations must produce exactly one account, and an old
      # backup must not hand seats back. The script creates throwaway
      # databases on the same server and drives the compiled service.
      - name: Prove licensing on real PostgreSQL (populated upgrade, seats, concurrency, restore)
        env:
          KAYAN_TEST_ADMIN_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
        run: python ../scripts/ci-diagnose.py node scripts/verify-licensing-postgres.mjs
      - name: Prove the required-accounts chart upgrade (old, complete and renumbered companies; run twice)
        run: python ../scripts/ci-diagnose.py node scripts/check-chart-upgrade.mjs

      # An upgrade of an installation that already has data, for the part of it
      # that is easiest to get wrong: cost centers arriving as a real accounting
      # dimension. The check builds a database at the schema that came before
      # them, fills it with legacy rows, and applies the rest.
      - name: Prove the cost-center upgrade on a pre-upgrade database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ci
          PGPASSWORD: ci
        run: python ../scripts/ci-diagnose.py node scripts/verify-cost-center-upgrade.mjs

      # The release guard decides whether a Windows build may overwrite a
      # published download; a wrong answer there is not recoverable.
      - name: Prove the release guard refuses a published release
        run: node --test ../scripts/check-release-tag.test.mjs

      # The PDF verifier is what the Windows smoke test trusts on the installed
      # machine, where nobody can look at the sheet. Its readers and its
      # joining rule are pinned on real files so a mistake there cannot pass as
      # a designed, joined, correctly numbered offer.
      - name: Prove the quotation PDF verifier reads a real sheet
        run: node --test scripts/verify-quotation-pdf.test.mjs scripts/verify-quotation-pdf.file.test.mjs

      - name: Pin the database-state classifier (empty/incomplete/ready/unknown)
        run: python ../scripts/ci-diagnose.py node scripts/check-database-state.mjs
      - name: Seed an isolated test company and administrator
        run: npx ts-node prisma/seed.ts
      - name: Start API and smoke-test database plus login
        run: |
          exec > >(tee /tmp/kayan-smoke.log) 2>&1
          npm run start:prod > /tmp/kayan-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /tmp/kayan-health.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/kayan-health.json ]; then
            cat /tmp/kayan-api.log
            exit 1
          fi
          cat /tmp/kayan-health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/kayan-health.json","utf8")); if(h.status!=="ok" || h.database!=="up" || h.needsSetup) process.exit(1)'
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"CI-only-Admin-Password-12345"}' > /tmp/kayan-login.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/kayan-login.json","utf8")); if(typeof r.accessToken!=="string" || !r.accessToken || typeof r.refreshToken!=="string" || !r.user) process.exit(1); console.log("Login smoke test passed for",r.user.username)'
          echo "Running warehouses, transfers, orders, and price-list scenario first..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-warehouses-orders.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after warehouse scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running chart-of-accounts and opening-balance spreadsheet imports..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-imports.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after import scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running return-costing and reversal scenario against the disposable PostgreSQL database..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-returns.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after return scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running full accounting business scenario last; it intentionally rate-limits failed logins..."
          if ! ENABLE_DISPOSABLE_RESET=true ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-accounting.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after accounting scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi

          echo "Running the end-to-end API check: real full backup (create, PGDMP download, upload, rehearsed restore), import-template download and import, exports and print..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 KAYAN_E2E_ALLOW_RESET=1 python ../scripts/ci-diagnose.py node scripts/api-check.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after api-check failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running the full accounting lifecycle scenario (hand-computed 2024: assets, depreciation, trading, reconciliations, close)..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-accounting-reconciliation.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after lifecycle scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running customer collections and supplier payments end to end: invoices, allocations, reversals, refusals, permissions, balances and the journal behind each one..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-collections-payments.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after collections and payments scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Verifying a fresh full backup restores into an ISOLATED database with identical data..."
          export PGPASSWORD=ci
          LOGIN_JSON=$(curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"CI-only-Admin-Password-12345"}')
          TOKEN=$(node -e 'console.log(JSON.parse(process.argv[1]).accessToken)' "$LOGIN_JSON")
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/backup/full -H "Authorization: Bearer $TOKEN" > /tmp/kayan-full.json
          DUMP=$(ls -t backups/*.dump | head -n 1)
          if [ -z "$DUMP" ] || [ ! -s "$DUMP" ]; then echo "No dump file was produced."; ls -la backups || true; exit 1; fi
          echo "Restoring $DUMP into erp_kayan_restore_check..."
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -q -c 'DROP DATABASE IF EXISTS erp_kayan_restore_check' -c 'CREATE DATABASE erp_kayan_restore_check'
          if ! pg_restore -h 127.0.0.1 -U ci -d erp_kayan_restore_check --no-owner "$DUMP" > /tmp/pg_restore.log 2>&1; then
            cat /tmp/pg_restore.log
            exit 1
          fi
          FAIL=0
          CHECKED=0
          for T in $(psql -h 127.0.0.1 -U ci -d erp_kayan -At -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY 1"); do
            case "$T" in *audit*|*session*|*token*|*log*) continue;; esac
            A=$(psql -h 127.0.0.1 -U ci -d erp_kayan -At -c "SELECT count(*) FROM \"$T\"")
            B=$(psql -h 127.0.0.1 -U ci -d erp_kayan_restore_check -At -c "SELECT count(*) FROM \"$T\"")
            CHECKED=$((CHECKED+1))
            if [ "$A" != "$B" ]; then echo "ROW COUNT MISMATCH $T: source=$A restored=$B"; FAIL=1; fi
          done
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "Isolated restore verified: $CHECKED non-volatile tables have identical row counts in source and restored databases."

          # Last, because it deliberately recreates the shape old restored data
          # can have: a receipt that reaches its partner only through the
          # invoices it settled. That data is inconsistent by construction, so
          # it must not be in place while the ageing/reconciliation checks run.
          echo "Running the partner statement end to end: allocation-only vouchers, the card, exports, print and the ledger behind every figure..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-statement-export.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after statement scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify the PostgreSQL client tools used by the backup checks
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
      - name: Build and restore the complete demo JSON on clean disposable databases
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo?schema=public
          ADMIN_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
          KAYAN_RESTORE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo_restore?schema=public
          KAYAN_BARE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo_bare?schema=public
          OUT_DIR: /tmp/kayan-demo-backup-build
        run: python ../scripts/ci-diagnose.py node scripts/build-demo-backup.mjs
        working-directory: backend
      - name: Report backend smoke-test diagnostics
        if: failure()
        run: |
          python ../scripts/ci-diagnose.py bash -c '
            echo "== /tmp/kayan-health.json =="; head -c 2000 /tmp/kayan-health.json 2>/dev/null
            echo; echo "== /tmp/kayan-login.json =="; head -c 2000 /tmp/kayan-login.json 2>/dev/null
            echo; echo "== /tmp/kayan-api.log (tail) =="; tail -c 8000 /tmp/kayan-api.log 2>/dev/null
            exit 1'
      - name: Record scenario totals
        if: always()
        run: |
          summary=$(grep -h "checks passed" /tmp/kayan-smoke.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Scenario checks::${summary:-summary not captured}"
      - name: Audit production dependencies
        run: npm audit --omit=dev

  regressions:
    name: Regression scenario (reported issues 1-9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan_regressions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan_regressions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_regressions?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      KAYAN_ADMIN_USERNAME: ci-admin
      KAYAN_ADMIN_PASSWORD: CI-only-Admin-Password-12345
      PORT: 3000
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations to a freshly created database
        run: npx prisma migrate deploy
      - name: Seed an isolated company and administrator
        run: npx ts-node prisma/seed.ts
      - name: Verify quotation migrations are present in the runtime database
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              const result = await client.query(
                "SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 'quotations' AND column_name IN ('design', 'columns') ORDER BY column_name"
              );
              const columns = result.rows.map((row) => row.column_name);
              console.log('Quotation columns verified:', columns.join(', '));
              if (!columns.includes('design') || !columns.includes('columns')) {
                throw new Error('The runtime database is missing quotation design/layout columns after migration and seed.');
              }
              const tableResult = await client.query(
                "SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 'quotation_tables' AND column_name = 'columns'"
              );
              if (tableResult.rows.length !== 1) {
                throw new Error('The runtime database is missing the per-table quotation columns column after migration.');
              }
              console.log('Per-table quotation columns verified: quotation_tables.columns');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Build API
        run: npm run build
      - name: Serve the web client and run the regression scenario
        run: |
          mkdir -p /tmp/kayan-web-probe/build/web
          printf '<!doctype html><html><body><div id="app">KAYAN WEB PROBE</div></body></html>' > /tmp/kayan-web-probe/build/web/index.html
          KAYAN_WEB_ROOT=/tmp/kayan-web-probe/build/web npm run start:prod > /tmp/kayan-regressions-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /tmp/kayan-regressions-health.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/kayan-regressions-health.json ]; then
            cat /tmp/kayan-regressions-api.log
            exit 1
          fi

          echo "Checking that the server address opens the web client, not a JSON 404..."
          curl -fsS http://127.0.0.1:3000/ > /tmp/kayan-root.html
          curl -fsS http://127.0.0.1:3000/sales/invoices > /tmp/kayan-spa.html
          grep -q "KAYAN WEB PROBE" /tmp/kayan-root.html
          grep -q "KAYAN WEB PROBE" /tmp/kayan-spa.html
          curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null
          echo "Web client served at / and at a client-side route; API still routed."

          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py bash -o pipefail -c 'node scripts/scenario-regressions.mjs http://127.0.0.1:3000/api/v1 | tee /tmp/kayan-regressions-scenario.log'; then
            echo "::group::API logs after regression scenario failure"
            cat /tmp/kayan-regressions-api.log
            echo "::endgroup::"
            exit 1
          fi

          echo "Running the quotation and discount scenario..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py bash -o pipefail -c 'node scripts/scenario-discounts-quotations.mjs http://127.0.0.1:3000/api/v1 | tee /tmp/kayan-quotations-scenario.log'; then
            echo "::group::API logs after quotation scenario failure"
            cat /tmp/kayan-regressions-api.log
            echo "::endgroup::"
            exit 1
          fi
      # Same reason as the backend job: the per-scenario totals are the
      # evidence a run can be read without the log host.
      - name: Record scenario totals
        if: always()
        run: |
          # The two scenarios word their summary differently ("checks passed"
          # and "passed"), so both shapes are looked for.
          summary=$(grep -hE "checks passed|[0-9]+/[0-9]+ passed" /tmp/kayan-regressions-scenario.log /tmp/kayan-quotations-scenario.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Regression scenario checks::${summary:-summary not captured}"

  flutter:
    name: Flutter Web (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: python scripts/ci-diagnose.py flutter analyze
      # Renders real screens (shell + dashboard, customers, sales) to PNG so
      # a design change can be inspected visually from the run's artifacts.
      # These are screenshot generators: baselines are regenerated here, so
      # the normal test run below compares against this run's own render.
      - name: Render design screenshots
        run: flutter test test/screenshots/design_screenshots_test.dart --update-goldens
      - name: Upload design screenshots
        uses: actions/upload-artifact@v4
        with:
          name: design-screenshots
          path: test/screenshots/goldens/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Run tests
        run: python scripts/ci-diagnose.py flutter test --reporter expanded
      # A failing test's own message sits in the middle of a long log, and the
      # log host is not always reachable. Re-running the one file leaves that
      # message inside the annotated tail.
      - name: Diagnose the voucher details widget test
        if: failure()
        run: python scripts/ci-diagnose.py flutter test test/widget/voucher_details_view_test.dart --reporter expanded
      - name: Build web
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: erp-kayan-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Linux Desktop (analyze, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: python scripts/ci-diagnose.py flutter analyze
      # Same screenshot generation as the web job: baselines are produced in
      # this job's own workspace so the test run below has something to
      # compare against (the PNGs themselves are uploaded by the web job).
      - name: Render design screenshots
        run: flutter test test/screenshots/design_screenshots_test.dart --update-goldens
      - name: Run tests
        run: python scripts/ci-diagnose.py flutter test --reporter expanded
      - name: Build Linux desktop
        run: flutter build linux --release
