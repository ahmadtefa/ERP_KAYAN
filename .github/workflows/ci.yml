name: ERP KAYAN CI

# Legacy full suite includes tests that create and sign test licences.
# Retained for review; do not dispatch until signing is moved to an approved VM.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (real Prisma and PostgreSQL smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      KAYAN_ADMIN_USERNAME: ci-admin
      KAYAN_ADMIN_PASSWORD: CI-only-Admin-Password-12345
      PORT: 3000
      NODE_ENV: test
      # The PGlite suites import an ES module, which Jest can only do with the
      # VM's dynamic import enabled. It belongs to the job because a step in
      # this job proves it is set: a per-step value made that proof fail every
      # time while the suites themselves ran.
      NODE_OPTIONS: --experimental-vm-modules
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # The service container is PostgreSQL 16, and a dump carries the version
      # of the pg_dump that wrote it: a newer client writes SET statements the
      # 16 server rejects ("unrecognized configuration parameter
      # transaction_timeout"), which turns a rehearsal into a false alarm.
      # Install the matching client explicitly instead of trusting whichever
      # version the runner image happens to preinstall.
      - name: Install PostgreSQL 16 client tools to match the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      # `npm ci` restores node_modules from the lockfile, which overwrites the
      # adapter patch that keeps `prisma migrate status` and the client's
      # driver-adapter path working: @prisma/adapter-pg 6.19.3 omits PostgreSQL
      # type `name` (OID 19) from fieldToColumnType(), so reading current_schema()
      # throws "Column type 'name' could not be deserialized". The script is
      # idempotent and exits non-zero if the expected shape is not found, so a
      # future adapter upgrade cannot silently skip the repair.
      - name: Repair the driver adapter's PostgreSQL type map
        run: node scripts/patch-adapter-pg-name-type.mjs
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type-check
        run: npx tsc --noEmit
      # The real-PostgreSQL suites (PGlite) load an ES module, which Jest can
      # only import when the VM has dynamic import enabled. Without this flag
      # those suites SKIPPED silently and the job reported green while proving
      # nothing about the SQL they exist to check. They now fail loudly instead,
      # so the flag has to be on - not optional, not per-file.
      - name: Prove the real-database suites are not silently skipped
        run: |
          node -e "const j=require('./jest.config.cjs');if(!j||!j.rootDir)process.exit(1)"
          node -e "if(!(process.env.NODE_OPTIONS||'').includes('--experimental-vm-modules')){console.error('NODE_OPTIONS must carry --experimental-vm-modules or the PGlite suites cannot run');process.exit(1)}"
      # Real-database specs (field-error-http) truncate and rebuild their own
      # company, and need a migrated schema. Give them a scratch database so
      # they neither hit an empty one nor disturb the smoke-test database below.
      - name: Create a migrated scratch database for the real-database specs
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_kayan_specs'
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/erp_kayan_specs?schema=public' node scripts/apply-migrations.mjs
      - name: Run all backend tests in bounded-memory batches
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_specs?schema=public
        # Each batch runs in its own Node process, preventing Jest's retained
        # worker state from growing until the whole suite exhausts the heap.
        # The runner discovers every *.spec.ts file and stops on the first
        # failure; no suites are filtered or skipped by this step.
        run: |
          python ../scripts/ci-diagnose.py bash -o pipefail -c 'node scripts/run-tests-batched.mjs 12 2>&1 | tee /tmp/kayan-jest.log'
      - name: Record unit-test totals
        if: always()
        run: |
          summary=$(grep -hE "^(Test Suites|Tests):" /tmp/kayan-jest.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Unit tests::${summary:-summary not captured}"
      # A green run means nothing if the real-database suites merely skipped.
      # This reads the log and fails when the PGlite counts are absent, so the
      # silent-skip failure mode cannot come back through a flag change.
      - name: Prove the real-database suites actually ran
        if: always()
        run: |
          python - <<'PY'
          import re, sys, pathlib
          log = pathlib.Path('/tmp/kayan-jest.log')
          if not log.exists():
              print('::error title=PGlite suites::the test log is missing, so nothing can be proven')
              sys.exit(1)
          text = log.read_text(errors='replace')
          # Jest prints one "PASS <path>" line per suite it actually executed.
          ran = set(re.findall(r'^PASS\s+(\S+(?:stock-takes\.barcode-count|stock-documents\.barcode-posting|expired-issue-policy\.integration|batches\.operations\.integration|batch-transfer-hold\.integration|multi-receipt\.integration|sales-batches\.integration|sales-invoice-posting\.integration|stock-transfers\.integration|items\.create\.http\.integration)\.spec\.ts)', text, re.M))
          expected = {
              'stock-takes.barcode-count.spec.ts',
              'stock-documents.barcode-posting.spec.ts',
              'expired-issue-policy.integration.spec.ts',
              'batches.operations.integration.spec.ts',
              'batch-transfer-hold.integration.spec.ts',
              'multi-receipt.integration.spec.ts',
              'sales-batches.integration.spec.ts',
              'sales-invoice-posting.integration.spec.ts',
              'stock-transfers.integration.spec.ts',
              'items.create.http.integration.spec.ts',
          }
          seen = {p.split('/')[-1] for p in ran}
          missing = sorted(expected - seen)
          print(f'::notice title=PGlite suites::executed {len(seen)}/{len(expected)}: {sorted(seen)}')
          if missing:
              print('::error title=PGlite suites did not run::' + ', '.join(missing))
              sys.exit(1)
          print('All 10 real-database suites executed; none were skipped.')
          PY
      # The two-company spec is skipped unless its database is the scratch one,
      # so a green log alone would not prove it ran against PostgreSQL.
      - name: Prove the two-company isolation spec ran on PostgreSQL
        if: always()
        run: |
          grep -E '^PASS\s+\S*company-isolation\.postgres\.spec\.ts' /tmp/kayan-jest.log \
            || { echo '::error title=Company isolation::the two-company PostgreSQL spec did not pass or did not run'; exit 1; }
      - name: Prove the licence seat concurrency spec ran on PostgreSQL
        if: always()
        run: |
          grep -E '^PASS\s+\S*licensing-seats\.postgres\.spec\.ts' /tmp/kayan-jest.log \
            || { echo '::error title=Licence seats::the PostgreSQL seat concurrency spec did not pass or did not run'; exit 1; }
      - name: Build API
        run: npm run build
      # `prisma migrate deploy` cannot run this project's migrations: Prisma
      # 6.19.3's WASM schema engine splits PL/pgSQL dollar-quoted bodies at
      # their internal semicolons, so the seven migrations that define
      # triggers die with `syntax error at or near "this"`. The native engine
      # cannot be used either - this project disables the engine download so
      # installs work offline. scripts/apply-migrations.mjs applies the same
      # files, in the same order, recording them in the same
      # _prisma_migrations table with the same SHA-256 checksums, so a database
      # it migrates is reported as up to date by `prisma migrate status`.
      - name: Apply migrations to ephemeral PostgreSQL
        run: node scripts/apply-migrations.mjs

      # Licensing is the one subsystem whose real behaviour cannot be shown
      # with a mocked database: the migration has to survive an installation
      # that already has accounts, seats have to be refused at the limit, two
      # simultaneous creations must produce exactly one account, and an old
      # backup must not hand seats back. The script creates throwaway
      # databases on the same server and drives the compiled service.
      # Every stock write must go through StockLedgerService, which writes
      # stock_movements; warehouse_stock_balances is its cached projection. The
      # two are only ever changed inside one transaction, so on a consistent
      # database SUM(IN - OUT) per (warehouse, item, location) always equals the
      # stored balance. This reconciles the whole installation with a FULL OUTER
      # JOIN so a shelf that was written without a movement - a silent cost or
      # quantity change - fails the build instead of being found by an accountant.
      - name: Prove the stock ledger and the shelf balances never disagree
        run: node scripts/pg-ledger-shelf-agreement.mjs
      - name: Prove licensing on real PostgreSQL (populated upgrade, seats, concurrency, restore)
        env:
          KAYAN_TEST_ADMIN_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
        run: python ../scripts/ci-diagnose.py node scripts/verify-licensing-postgres.mjs
      - name: Prove the required-accounts chart upgrade (old, complete and renumbered companies; run twice)
        run: python ../scripts/ci-diagnose.py node scripts/check-chart-upgrade.mjs

      # An upgrade of an installation that already has data, for the part of it
      # that is easiest to get wrong: cost centers arriving as a real accounting
      # dimension. The check builds a database at the schema that came before
      # them, fills it with legacy rows, and applies the rest.
      - name: Prove the cost-center upgrade on a pre-upgrade database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ci
          PGPASSWORD: ci
        run: python ../scripts/ci-diagnose.py node scripts/verify-cost-center-upgrade.mjs

      # Multi-role access control arrived as an additive migration and a
      # start-up pass that adds the roles an older installation is missing.
      # The check that matters is that nothing else moved: users keep their
      # password hash, their photo, their branch and their assignments, a
      # legacy grant stays a grant, and a role a company had already tuned is
      # not rewritten. It builds a database at the schema before the migration,
      # fills it with legacy rows, applies the migration and then runs the
      # catalogue pass twice.
      - name: Prove the multi-role upgrade on a pre-upgrade database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ci
          PGPASSWORD: ci
        run: python ../scripts/ci-diagnose.py node scripts/verify-rbac-upgrade.mjs

      # The release guard decides whether a Windows build may overwrite a
      # published download; a wrong answer there is not recoverable.
      - name: Prove the release guard refuses a published release
        run: node --test ../scripts/check-release-tag.test.mjs

      # The PDF verifier is what the Windows smoke test trusts on the installed
      # machine, where nobody can look at the sheet. Its readers and its
      # joining rule are pinned on real files so a mistake there cannot pass as
      # a designed, joined, correctly numbered offer.
      - name: Prove the quotation PDF verifier reads a real sheet
        run: node --test scripts/verify-quotation-pdf.test.mjs scripts/verify-quotation-pdf.file.test.mjs

      # The demo backup check derives its books from trial-balance rows because
      # the report's totals are withheld from non-finance roles. Pin that the
      # exact-decimal comparison fails on unbalanced, dropped, duplicated and
      # changed rows, so the derived check cannot pass by accident.
      - name: Prove the row-derived books comparison fails on bad ledgers
        run: node --test scripts/trial-balance-books.test.mjs
      - name: Pin the database-state classifier (empty/incomplete/ready/unknown)
        run: python ../scripts/ci-diagnose.py node scripts/check-database-state.mjs
      - name: Seed an isolated test company and administrator
        run: npx ts-node prisma/seed.ts
      - name: Start API and smoke-test database plus login
        run: |
          exec > >(tee /tmp/kayan-smoke.log) 2>&1
          npm run start:prod > /tmp/kayan-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          # Wait for a *working* database, not merely for an answer. The
          # health route answers 200 with `"database":"down"` while the
          # connection is still being established, so a loop that stops at the
          # first 200 would read a starting server as a broken one. It is also
          # what made a raw-query failure look like a database outage.
          health_ok=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /tmp/kayan-health.json 2>/dev/null; then
              if node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/kayan-health.json","utf8")); process.exit(h.status==="ok" && h.database==="up" ? 0 : 1)'; then
                health_ok=true
                break
              fi
              echo "health attempt ${attempt}: $(cat /tmp/kayan-health.json)"
            fi
            sleep 2
          done
          if [ "$health_ok" != "true" ]; then
            echo "::error::The API never reported a working database within 60 seconds."
            cat /tmp/kayan-health.json 2>/dev/null || true
            cat /tmp/kayan-api.log
            exit 1
          fi
          cat /tmp/kayan-health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/kayan-health.json","utf8")); if(h.status!=="ok" || h.database!=="up" || h.needsSetup) process.exit(1)'
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"CI-only-Admin-Password-12345"}' > /tmp/kayan-login.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/kayan-login.json","utf8")); if(typeof r.accessToken!=="string" || !r.accessToken || typeof r.refreshToken!=="string" || !r.user) process.exit(1); console.log("Login smoke test passed for",r.user.username)'
          echo "Running warehouses, transfers, orders, and price-list scenario first..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-warehouses-orders.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after warehouse scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running chart-of-accounts and opening-balance spreadsheet imports..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-imports.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after import scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Running return-costing and reversal scenario against the disposable PostgreSQL database..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-returns.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after return scenario failure"
            cat /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          # The complete backup runs before the long accounting scenarios: it
          # replaces the whole database with a copy taken moments earlier, so
          # it must not disturb a scenario that is halfway through building a
          # year of figures -- and it must not be skipped because one of those
          # scenarios failed later on.
          echo "Running the complete system backup and restore scenario: gate, archive, verification, damaged file, restore, status, re-login..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-system-backup.mjs http://127.0.0.1:3000/api/v1; then
            echo "::group::API logs after the system backup scenario failure"
            tail -c 8000 /tmp/kayan-api.log
            echo "::endgroup::"
            exit 1
          fi
          # The accounting scenarios below look accounts up by the legacy 4-digit
          # codes (1101, 1103, 2101 ...). This job's main database is seeded with
          # the modern 2/4/6/8 digit chart, which the item, import and backup
          # checks above rely on, so these scenarios run against LEGACY-seeded
          # databases behind a second API on port 3001. Each one gets a fresh
          # copy of one migrated, LEGACY-seeded template, because accounting and
          # api-check reset the company and a company set up again after a reset
          # gets the modern chart. Nothing about the scenarios is weakened and
          # the modern database is not touched by them.
          echo "Preparing the migrated LEGACY-chart template database for the legacy-coded scenarios..."
          export PGPASSWORD=ci
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -q -c 'DROP DATABASE IF EXISTS erp_kayan_legacy_template' -c 'CREATE DATABASE erp_kayan_legacy_template'
          TEMPLATE_DB='postgresql://ci:ci@127.0.0.1:5432/erp_kayan_legacy_template?schema=public'
          DATABASE_URL="$TEMPLATE_DB" node scripts/apply-migrations.mjs
          DATABASE_URL="$TEMPLATE_DB" KAYAN_SEED_ACCOUNT_CODE_SCHEME=LEGACY npx ts-node prisma/seed.ts
          LEGACY_API=http://127.0.0.1:3001/api/v1
          # Scenarios that also read PostgreSQL directly must read the database their API writes to.
          LEGACY_DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/erp_kayan_legacy?schema=public'
          LEGACY_PID=""
          trap 'kill "$API_PID" $LEGACY_PID 2>/dev/null || true' EXIT
          fresh_legacy() {
            if [ -n "$LEGACY_PID" ]; then kill "$LEGACY_PID" 2>/dev/null || true; wait "$LEGACY_PID" 2>/dev/null || true; fi
            psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -q -c 'DROP DATABASE IF EXISTS erp_kayan_legacy WITH (FORCE)' -c 'CREATE DATABASE erp_kayan_legacy TEMPLATE erp_kayan_legacy_template'
            DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/erp_kayan_legacy?schema=public' PORT=3001 npm run start:prod > /tmp/kayan-api-legacy.log 2>&1 &
            LEGACY_PID=$!
            local ok=false
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/api/v1/health > /tmp/kayan-health-legacy.json 2>/dev/null &&
                 node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/kayan-health-legacy.json","utf8")); process.exit(h.status==="ok" && h.database==="up" ? 0 : 1)'; then
                ok=true
                break
              fi
              sleep 2
            done
            if [ "$ok" != "true" ]; then
              echo "::error::The legacy-chart API never reported a working database within 60 seconds."
              tail -c 8000 /tmp/kayan-api-legacy.log
              return 1
            fi
          }
          fresh_legacy
          echo "Running full accounting business scenario last; it intentionally rate-limits failed logins..."
          if ! ENABLE_DISPOSABLE_RESET=true ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 DATABASE_URL="$LEGACY_DATABASE_URL" python ../scripts/ci-diagnose.py node scripts/scenario-accounting.mjs "$LEGACY_API"; then
            echo "::group::API logs after accounting scenario failure"
            cat /tmp/kayan-api-legacy.log
            echo "::endgroup::"
            exit 1
          fi

          fresh_legacy
          echo "Running the end-to-end API check: real full backup (create, PGDMP download, upload, rehearsed restore), import-template download and import, exports and print..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 KAYAN_E2E_ALLOW_RESET=1 python ../scripts/ci-diagnose.py node scripts/api-check.mjs "$LEGACY_API"; then
            echo "::group::API logs after api-check failure"
            cat /tmp/kayan-api-legacy.log
            echo "::endgroup::"
            exit 1
          fi
          fresh_legacy
          echo "Running the full accounting lifecycle scenario (hand-computed 2024: assets, depreciation, trading, reconciliations, close)..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py node scripts/scenario-accounting-reconciliation.mjs "$LEGACY_API"; then
            echo "::group::API logs after lifecycle scenario failure"
            cat /tmp/kayan-api-legacy.log
            echo "::endgroup::"
            exit 1
          fi
          fresh_legacy
          echo "Running customer collections and supplier payments end to end: invoices, allocations, reversals, refusals, permissions, balances and the journal behind each one..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 DATABASE_URL="$LEGACY_DATABASE_URL" python ../scripts/ci-diagnose.py node scripts/scenario-collections-payments.mjs "$LEGACY_API"; then
            echo "::group::API logs after collections and payments scenario failure"
            cat /tmp/kayan-api-legacy.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Verifying a fresh complete backup restores into an ISOLATED database with identical data..."
          # A complete backup, not the legacy dump-only endpoint: that one is
          # closed on purpose, because a bare pg_dump cannot carry the uploaded
          # files and a restore of it would leave them orphaned. The archive is
          # taken by the program, downloaded whole, and its dump handed to
          # pg_restore -- so this step proves the same bytes a customer would
          # get back actually rebuild the database.
          export PGPASSWORD=ci
          LOGIN_JSON=$(curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"CI-only-Admin-Password-12345"}')
          TOKEN=$(node -e 'console.log(JSON.parse(process.argv[1]).accessToken)' "$LOGIN_JSON")
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/backup/complete -H "Authorization: Bearer $TOKEN" > /tmp/kayan-complete.json
          ARCHIVE=$(node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/kayan-complete.json","utf8")); process.stdout.write(r.file?.name ?? "")')
          if [ -z "$ARCHIVE" ]; then echo "No complete archive was produced:"; head -c 2000 /tmp/kayan-complete.json; exit 1; fi
          echo "Downloading $ARCHIVE"
          curl -fsS "http://127.0.0.1:3000/api/v1/backup/complete/$ARCHIVE/download" -H "Authorization: Bearer $TOKEN" -o /tmp/kayan-complete.kayanbackup
          rm -rf /tmp/kayan-archive && mkdir -p /tmp/kayan-archive
          tar -xf /tmp/kayan-complete.kayanbackup -C /tmp/kayan-archive database/database.dump
          DUMP=/tmp/kayan-archive/database/database.dump
          if [ ! -s "$DUMP" ]; then echo "The archive carried no database dump."; tar -tvf /tmp/kayan-complete.kayanbackup; exit 1; fi
          echo "Restoring the archive's dump ($(stat -c%s "$DUMP") bytes) into erp_kayan_restore_check..."
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -q -c 'DROP DATABASE IF EXISTS erp_kayan_restore_check' -c 'CREATE DATABASE erp_kayan_restore_check'
          if ! pg_restore -h 127.0.0.1 -U ci -d erp_kayan_restore_check --no-owner "$DUMP" > /tmp/pg_restore.log 2>&1; then
            cat /tmp/pg_restore.log
            exit 1
          fi
          FAIL=0
          CHECKED=0
          for T in $(psql -h 127.0.0.1 -U ci -d erp_kayan -At -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY 1"); do
            case "$T" in *audit*|*session*|*token*|*log*) continue;; esac
            A=$(psql -h 127.0.0.1 -U ci -d erp_kayan -At -c "SELECT count(*) FROM \"$T\"")
            B=$(psql -h 127.0.0.1 -U ci -d erp_kayan_restore_check -At -c "SELECT count(*) FROM \"$T\"")
            CHECKED=$((CHECKED+1))
            if [ "$A" != "$B" ]; then echo "ROW COUNT MISMATCH $T: source=$A restored=$B"; FAIL=1; fi
          done
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "Isolated restore verified: $CHECKED non-volatile tables have identical row counts in source and restored databases."

          # Last, because it deliberately recreates the shape old restored data
          # can have: a receipt that reaches its partner only through the
          # invoices it settled. That data is inconsistent by construction, so
          # it must not be in place while the ageing/reconciliation checks run.
          fresh_legacy
          echo "Running the partner statement end to end: allocation-only vouchers, the card, exports, print and the ledger behind every figure..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 DATABASE_URL="$LEGACY_DATABASE_URL" python ../scripts/ci-diagnose.py node scripts/scenario-statement-export.mjs "$LEGACY_API"; then
            echo "::group::API logs after statement scenario failure"
            cat /tmp/kayan-api-legacy.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify the PostgreSQL client tools used by the backup checks
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
      - name: Build and restore the complete demo JSON on clean disposable databases
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo?schema=public
          ADMIN_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
          KAYAN_RESTORE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo_restore?schema=public
          KAYAN_BARE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_demo_bare?schema=public
          OUT_DIR: /tmp/kayan-demo-backup-build
        run: python ../scripts/ci-diagnose.py node scripts/build-demo-backup.mjs
        working-directory: backend
      - name: Report backend smoke-test diagnostics
        if: failure()
        run: |
          python ../scripts/ci-diagnose.py bash -c '
            echo "== /tmp/kayan-health.json =="; head -c 2000 /tmp/kayan-health.json 2>/dev/null
            echo; echo "== /tmp/kayan-login.json =="; head -c 2000 /tmp/kayan-login.json 2>/dev/null
            echo; echo "== /tmp/kayan-api.log (tail) =="; tail -c 8000 /tmp/kayan-api.log 2>/dev/null
            echo; echo "== /tmp/kayan-api-legacy.log (tail) =="; tail -c 4000 /tmp/kayan-api-legacy.log 2>/dev/null
            exit 1'
      - name: Record scenario totals
        if: always()
        run: |
          summary=$(grep -h "checks passed" /tmp/kayan-smoke.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Scenario checks::${summary:-summary not captured}"
      - name: Audit production dependencies
        run: npm audit --omit=dev

  regressions:
    name: Regression scenario (reported issues 1-9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: erp_kayan_regressions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d erp_kayan_regressions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/erp_kayan_regressions?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-9876543210
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      KAYAN_ADMIN_USERNAME: ci-admin
      KAYAN_ADMIN_PASSWORD: CI-only-Admin-Password-12345
      PORT: 3000
      NODE_ENV: test
      # The PGlite suites import an ES module, which Jest can only do with the
      # VM's dynamic import enabled. It belongs to the job because a step in
      # this job proves it is set: a per-step value made that proof fail every
      # time while the suites themselves ran.
      NODE_OPTIONS: --experimental-vm-modules
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Repair the driver adapter's PostgreSQL type map
        run: node scripts/patch-adapter-pg-name-type.mjs
      - name: Generate Prisma Client
        run: npx prisma generate
      # See the note on the equivalent step above: the project applies its own
      # migration files because Prisma's WASM schema engine mis-splits
      # dollar-quoted function bodies.
      - name: Apply migrations to a freshly created database
        run: node scripts/apply-migrations.mjs
      - name: Seed an isolated company and administrator
        env:
          # This scenario looks accounts up by the legacy 4-digit codes
          # (1101, 1102, 3103). New companies now get the 2/4/6/8 digit chart,
          # so seed the legacy one here, as kayan-acceptance.yml does.
          KAYAN_SEED_ACCOUNT_CODE_SCHEME: LEGACY
        run: npx ts-node prisma/seed.ts
      - name: Verify quotation migrations are present in the runtime database
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              const result = await client.query(
                "SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 'quotations' AND column_name IN ('design', 'columns') ORDER BY column_name"
              );
              const columns = result.rows.map((row) => row.column_name);
              console.log('Quotation columns verified:', columns.join(', '));
              if (!columns.includes('design') || !columns.includes('columns')) {
                throw new Error('The runtime database is missing quotation design/layout columns after migration and seed.');
              }
              const tableResult = await client.query(
                "SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 'quotation_tables' AND column_name = 'columns'"
              );
              if (tableResult.rows.length !== 1) {
                throw new Error('The runtime database is missing the per-table quotation columns column after migration.');
              }
              console.log('Per-table quotation columns verified: quotation_tables.columns');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Build API
        run: npm run build
      - name: Serve the web client and run the regression scenario
        run: |
          mkdir -p /tmp/kayan-web-probe/build/web
          printf '<!doctype html><html><body><div id="app">KAYAN WEB PROBE</div></body></html>' > /tmp/kayan-web-probe/build/web/index.html
          KAYAN_WEB_ROOT=/tmp/kayan-web-probe/build/web npm run start:prod > /tmp/kayan-regressions-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /tmp/kayan-regressions-health.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/kayan-regressions-health.json ]; then
            cat /tmp/kayan-regressions-api.log
            exit 1
          fi

          echo "Checking that the server address opens the web client, not a JSON 404..."
          curl -fsS http://127.0.0.1:3000/ > /tmp/kayan-root.html
          curl -fsS http://127.0.0.1:3000/sales/invoices > /tmp/kayan-spa.html
          grep -q "KAYAN WEB PROBE" /tmp/kayan-root.html
          grep -q "KAYAN WEB PROBE" /tmp/kayan-spa.html
          curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null
          echo "Web client served at / and at a client-side route; API still routed."

          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py bash -o pipefail -c 'node scripts/scenario-regressions.mjs http://127.0.0.1:3000/api/v1 | tee /tmp/kayan-regressions-scenario.log'; then
            echo "::group::API logs after regression scenario failure"
            cat /tmp/kayan-regressions-api.log
            echo "::endgroup::"
            exit 1
          fi

          echo "Running the quotation and discount scenario..."
          if ! ADMIN_USERNAME=ci-admin ADMIN_PASSWORD=CI-only-Admin-Password-12345 python ../scripts/ci-diagnose.py bash -o pipefail -c 'node scripts/scenario-discounts-quotations.mjs http://127.0.0.1:3000/api/v1 | tee /tmp/kayan-quotations-scenario.log'; then
            echo "::group::API logs after quotation scenario failure"
            cat /tmp/kayan-regressions-api.log
            echo "::endgroup::"
            exit 1
          fi
      # Same reason as the backend job: the per-scenario totals are the
      # evidence a run can be read without the log host.
      - name: Record scenario totals
        if: always()
        run: |
          # The two scenarios word their summary differently ("checks passed"
          # and "passed"), so both shapes are looked for.
          summary=$(grep -hE "checks passed|[0-9]+/[0-9]+ passed" /tmp/kayan-regressions-scenario.log /tmp/kayan-quotations-scenario.log 2>/dev/null | tr '\n' ' | ')
          echo "::notice title=Regression scenario checks::${summary:-summary not captured}"

  backup-restore-17:
    name: Complete backup and restore on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # PostgreSQL 17, server and client of the same version: a dump carries
      # its writer's version, and rehearsing a 17 dump with a 16 pg_restore
      # would fail for a reason that has nothing to do with this program.
      - name: Install PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/postgres --version
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      # The harness creates its own cluster, applies the real migrations, seeds
      # a fixture and then exercises: complete backup, verification, tampered
      # archive refused, restore, safety backup, automatic rollback of a
      # restore that dies half way, journal-driven recovery after a simulated
      # power cut, one-restore-at-a-time, uploaded files, and the licence file
      # being left untouched.
      - name: Prove the complete backup and restore on PostgreSQL 17
        run: python ../scripts/ci-diagnose.py npx ts-node --transpile-only scripts/verify-system-backup.ts --pgbin /usr/lib/postgresql/17/bin

  flutter:
    name: Flutter Web (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned like every other workflow in this repository. `stable`
          # floats, and the SDK that arrived on it reclassifies
          # `package:flutter/material.dart` as deprecated in every file.
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: python scripts/ci-diagnose.py flutter analyze
      # Renders real screens (shell + dashboard, customers, sales) to PNG so
      # a design change can be inspected visually from the run's artifacts.
      # These are screenshot generators: baselines are regenerated here, so
      # the normal test run below compares against this run's own render.
      - name: Render design screenshots
        # Through ci-diagnose so a failure's own message reaches the run's
        # annotations: the log host is not always reachable from a repair
        # session, and "2 tests passed, 1 failed" names no test.
        run: python scripts/ci-diagnose.py flutter test test/screenshots/design_screenshots_test.dart --update-goldens --reporter expanded
      - name: Diagnose the design screenshots
        if: failure()
        run: python scripts/ci-diagnose.py flutter test test/screenshots/design_screenshots_test.dart --update-goldens --reporter expanded
      - name: Render stock documents pilot pictures
        env:
          KAYAN_VISUAL_OUTPUT: ${{ github.workspace }}/build/stockdoc-pictures
        run: python scripts/ci-diagnose.py flutter test test/widget/stock_documents_screen_test.dart test/widget/stock_transfer_create_errors_test.dart test/widget/stock_takes_screen_test.dart test/widget/reset_recovery_visual_test.dart test/widget/item_opening_shelf_test.dart --reporter expanded
      - name: Upload stock documents pilot pictures
        uses: actions/upload-artifact@v4
        with:
          name: stockdoc-pictures-${{ github.sha }}
          path: build/stockdoc-pictures/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload design screenshots
        uses: actions/upload-artifact@v4
        with:
          name: design-screenshots
          path: test/screenshots/goldens/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Run tests
        run: python scripts/ci-diagnose.py flutter test --reporter expanded
      # A failing test's own message sits in the middle of a long log, and the
      # log host is not always reachable. Re-running the one file leaves that
      # message inside the annotated tail.
      - name: Diagnose the voucher details widget test
        if: failure()
        run: python scripts/ci-diagnose.py flutter test test/widget/voucher_details_view_test.dart --reporter expanded
      - name: Build web
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: erp-kayan-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Linux Desktop (analyze, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate platform icons from 1.png
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned like every other workflow in this repository. `stable`
          # floats, and the SDK that arrived on it reclassifies
          # `package:flutter/material.dart` as deprecated in every file.
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: python scripts/ci-diagnose.py flutter analyze
      # Same screenshot generation as the web job: baselines are produced in
      # this job's own workspace so the test run below has something to
      # compare against (the PNGs themselves are uploaded by the web job).
      - name: Render design screenshots
        run: python scripts/ci-diagnose.py flutter test test/screenshots/design_screenshots_test.dart --update-goldens --reporter expanded
      - name: Run tests
        run: python scripts/ci-diagnose.py flutter test --reporter expanded
      - name: Build Linux desktop
        run: flutter build linux --release

  # The Android key generator is an independent Dart implementation of the
  # same key format. Nothing ran its tests before. Everything here is
  # synthetic: the signing seed is fixed test data written by
  # tool/make_goldens.mjs, no real key exists in CI, and nothing is published.
  android-key-generator:
    name: Android key generator (analyze, test against the Node generator)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only the product's key format code is compiled (it imports nothing but
      # node:crypto), so the vectors are checked by the code the customer runs.
      - name: Compile the product key format code
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npx tsc src/modules/licensing/license-key.ts --outDir dist/src/modules/licensing-out --module commonjs --target es2022 --skipLibCheck --esModuleInterop
          mkdir -p dist/src/modules/licensing
          cp dist/src/modules/licensing-out/license-key.js dist/src/modules/licensing/license-key.js
      - name: Generate the golden vectors with the Node generator (synthetic key)
        working-directory: tools/license-generator/android-app
        run: node tool/make_goldens.mjs
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: tools/license-generator/android-app
        run: flutter pub get
      - name: Analyze
        working-directory: tools/license-generator/android-app
        run: flutter analyze
      - name: Test
        working-directory: tools/license-generator/android-app
        run: flutter test --reporter expanded

  # Builds the operator tool as tools/license-generator/sea/build.mjs does and
  # checks only what needs no key: the executables exist, the bundled service
  # starts and reports version and help, the package holds no key file. It never
  # creates, reads or uses a signing key and publishes nothing. It is a build
  # and start check, not a qualification of the generator for customers. The
  # legacy key-generator.yml (throwaway signing key) stays prohibited. This
  # lives in ci.yml because a new standalone workflow file cannot be dispatched
  # from a branch until it exists on the default branch.
  windows-key-generator-build:
    name: Windows key generator build check (no signing)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the build-time packaging tools
        working-directory: tools/license-generator/sea
        run: npm ci
      - name: Source tests (synthetic in-memory key only)
        run: node --test tools/license-generator/memory-flow.test.mjs
      - name: Package KAYAN-Key-Generator.exe
        working-directory: tools/license-generator/sea
        run: node build.mjs --target win32-x64 --out "$env:GITHUB_WORKSPACE\dist\key-generator"
      - name: Check the package without any key
        shell: pwsh
        run: |
          $folder = 'dist\key-generator'
          foreach ($name in 'KAYAN-Key-Generator.exe', 'KAYAN-Key-Generator-Server.exe', 'BUILD-INFO.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $folder $name))) { throw "missing $name" }
          }
          $server = Join-Path $folder 'KAYAN-Key-Generator-Server.exe'
          $version = & $server version
          Write-Host "server version line: $version"
          if ($version -notmatch '^kayan-license \d') { throw 'the bundled service did not report its version' }
          $help = (& $server help) -join "`n"
          if ($help -notmatch 'verify') { throw 'the bundled service did not print its help' }
          foreach ($file in Get-ChildItem -Recurse -File $folder) {
            if ($file.Extension -in '.pem', '.key') { throw "unexpected key file $($file.Name)" }
          }
          Get-ChildItem $folder | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) | Write-Host }
      - name: Keep the build information
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-Key-Generator-build-check
          path: dist/key-generator/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
